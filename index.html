        var gameNames = { mini_a: "mini toto A組", mini_b: "mini toto B組", goal3: "toto GOAL3", toto_main: "toto 本戦" };

        if (!myBets || myBets.length === 0) {
          listEl.innerHTML = '<div style="font-size:12px; color:#94a3b8;">まだ登録された買い目がありません。「📌 購入済に登録」ボタンまたは上の入力欄から追加できます。</div>';
        } else {
          var totalCost = 0;
          var winCount = 0;
          var rowsHtml = myBets.map(function(bet) {
            totalCost += (bet.cost || 100);
            var j = judgeTicketAgainstActuals(bet.picks, actualArrays[bet.gameType] || [], bet.gameType);
            if (j.isWin) winCount++;
            return (
              '<div class="my-ticket-item' + (j.isWin ? ' win-item' : '') + '">' +
                '<div>' +
                  '<div style="font-size:11.5px; color:#fbbf24; font-weight:bold;">[' + escapeHtml(gameNames[bet.gameType] || bet.gameType) + '] ' + escapeHtml(bet.label || "") + '（' + formatYen(bet.cost || 100) + '）</div>' +
                  '<div style="font-size:14px; font-weight:bold; margin-top:2px;">' + j.lineHtml + '</div>' +
                '</div>' +
                '<div style="display:flex; align-items:center; gap:6px;">' +
                  j.statusBadge +
                  '<button type="button" class="del-ticket-btn" data-del-id="' + escapeHtml(bet.id) + '">削除</button>' +
                '</div>' +
              '</div>'
            );
          }).join("");
          var winSummary = winCount > 0 ? (' ／ 🎉 当選: ' + winCount + '件') : '';
          listEl.innerHTML = '<div style="font-size:12px; color:#6ee7b7; font-weight:bold; margin-bottom:6px;">✓ 登録済み（計 ' + formatYen(totalCost) + winSummary + '）</div>' + rowsHtml;
          listEl.querySelectorAll(".del-ticket-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
              var id = btn.getAttribute("data-del-id");
              saveMyBets(currentRoundKey, loadMyBets(currentRoundKey).filter(function(b) { return b.id !== id; }));
              renderResultsTabSection(analyzed, actuals, rObj);
            });
          });
        }

        var finishedMatches = analyzed.filter(function(x) {
          var a = actuals[String(x.f)];
          return a && a.res !== undefined && a.res !== null && a.res !== "";
        });

        if (finishedMatches.length === 0) {
          document.getElementById("results-list").innerHTML = '<div class="empty-msg">試合終了後に確定結果とプラン別の答え合わせが表示されます。</div>';
          return;
        }

        var g3Items = [];
        if (hasGoal3) getGoal3Matches(analyzed, rObj).forEach(function(x) { g3Items.push(x.gH); g3Items.push(x.gA); });
        var maItems = hasMiniA ? analyzed.slice(0, 5).map(function(x) { return x.c1x2; }) : [];
        var mbItems = hasMiniB ? analyzed.slice(5, 10).map(function(x) { return x.c1x2; }) : [];
        var tmItems = hasTotoMain ? analyzed.map(function(x) { return x.c1x2; }) : [];

        var modes = ["smart", 500, 1000, 1500, 2000];
        var gameRowsCfg = [
          { label: "mini toto A組（1〜5枠）", gameType: "mini_a", items: maItems, act: actualArrays.mini_a },
          { label: "mini toto B組（6〜10枠）", gameType: "mini_b", items: mbItems, act: actualArrays.mini_b },
          { label: "toto GOAL3（指定3試合）", gameType: "goal3", items: g3Items, act: actualArrays.goal3 },
          { label: "toto 本戦（全13枠）", gameType: "toto_main", items: tmItems, act: actualArrays.toto_main }
        ];

        var tableRows = gameRowsCfg.map(function(gCfg) {
          if (!gCfg.items || gCfg.items.length === 0) return "";
          var isG3 = (gCfg.gameType === "goal3");
          var actStr = gCfg.act.map(function(c) { return c !== null ? formatPickCode(c, isG3) : "?"; }).join("-");
          var cells = modes.map(function(md) {
            var m = evaluatePlanMetrics(gCfg.items, md, gCfg.gameType);
            var bestJ = null, bestHit = -1;
            m.ticketGroups.forEach(function(grp) {
              var jr = judgeTicketAgainstActuals(grp.picks, gCfg.act, gCfg.gameType);
              if (jr.hitCount > bestHit) { bestHit = jr.hitCount; bestJ = jr; }
            });
            var skipTag = m.isSkipRecommended ? ' <span style="color:#fde047;">(見送り)</span>' : '';
            return (
              '<td>' +
                '<div>' + (bestJ ? bestJ.statusBadge : "-") + '</div>' +
                '<div style="font-size:11px; color:#94a3b8; margin-top:2px;">' + formatYen(m.cost) + '（' + (bestJ ? bestJ.hitCount + '/' + bestJ.totalFrames + '枠' : '-') + '）' + skipTag + '</div>' +
              '</td>'
            );
          }).join("");
          return '<tr><td><strong style="color:#38bdf8;">' + gCfg.label + '</strong><br/><span style="font-size:11px; color:#94a3b8;">確定出目: ' + actStr + '</span></td>' + cells + '</tr>';
        }).join("");

        var matchScoreRows = finishedMatches.map(function(x) {
          var a = actuals[String(x.f)];
          var isCan = isCancelledResult(a.res);
          var ok1 = isCan || String(a.res) === x.c1x2.top1;
          var ok2 = ok1 || String(a.res) === x.c1x2.top2;
          var mark = isCan
            ? '<span style="color:#fbbf24; font-weight:bold;">⚠️ 中止（全的中扱）</span>'
            : (ok1 ? '<span style="color:#4ade80; font-weight:bold;">✅ 本命的中</span>' : (ok2 ? '<span style="color:#38bdf8; font-weight:bold;">☑️ 2点W的中</span>' : '<span style="color:#f87171;">❌ 波乱外れ</span>'));
          var hsDisp = parseValidScore(a.hs);
          var asDisp = parseValidScore(a.as);
          var scoreDisp = isCan ? '中止' : ((hsDisp !== null && asDisp !== null) ? (hsDisp + ' - ' + asDisp) : '確定');
          return (
            '<div class="compact-match-row">' +
              '<div><strong>第' + x.f + '枠</strong>：' + escapeHtml(x.h) + ' <strong>' + scoreDisp + '</strong> ' + escapeHtml(x.a) + ' （結果: <strong>[' + escapeHtml(a.res) + ']</strong>）</div>' +
              '<div>AI予想: [' + x.c1x2.top1 + '/' + x.c1x2.top2 + '] ｜ ' + mark + '</div>' +
            '</div>'
          );
        }).join("");

        document.getElementById("results-list").innerHTML =
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">📊 くじ種・買い方モード別の的中結果一覧</div>' +
            '<div class="table-scroll-wrap">' +
              '<table class="tier-table">' +
                '<thead><tr><th>くじ種（確定出目）</th><th>⚡ AI強弱マルチ</th><th>500円</th><th>1,000円</th><th>1,500円</th><th>2,000円</th></tr></thead>' +
                '<tbody>' + tableRows + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>' +
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">⚽ 各試合の確定スコア＆的中一覧（確定 ' + finishedMatches.length + '試合）</div>' +
            matchScoreRows +
          '</div>';
      }

      /* タブ3: 振り返り（1x2絶対鉄板＋GOAL3絶対鉄板の両方を集計＆検証） */
      function renderReviewTabSection(analyzed, actuals, rObj) {
        var revEl = document.getElementById("review-list");
        if (!revEl) return;

        var sMatches = analyzed.filter(function(x) { return x.c1x2.rank === "S"; });
        var totalFin = 0, hit1 = 0, hit2 = 0, sHit = 0, sTotal = 0;

        analyzed.forEach(function(x) {
          var a = actuals[String(x.f)];
          if (!a || a.res === undefined || a.res === null || a.res === "" || isCancelledResult(a.res)) return;
          totalFin++;
          var r = String(a.res);
          if (r === x.c1x2.top1) hit1++;
          if (r === x.c1x2.top1 || r === x.c1x2.top2) hit2++;
          if (x.c1x2.rank === "S") {
            sTotal++;
            if (r === x.c1x2.top1) sHit++;
          }
        });

        var g3SolidRows = [];
        var g3SHit = 0, g3STotalFin = 0;
        if (isGameAvailable("goal3", analyzed.length)) {
          getGoal3Matches(analyzed, rObj).forEach(function(x) {
            var a = actuals[String(x.f)];
            var isCan = a && isCancelledResult(a.res);
            var hs = (a && !isCan) ? parseValidScore(a.hs) : null;
            var as = (a && !isCan) ? parseValidScore(a.as) : null;
            [
              { item: x.gH, score: hs !== null ? String(Math.min(3, hs)) : null },
              { item: x.gA, score: as !== null ? String(Math.min(3, as)) : null }
            ].forEach(function(pair) {
              if (pair.item.rank !== "S") return;
              if (pair.score !== null) {
                g3STotalFin++;
                if (pair.score === pair.item.top1) g3SHit++;
              }
              var resTxt = isCan
                ? '<span style="color:#fbbf24;">⚠️ 中止</span>'
                : (pair.score !== null
                    ? ('実得点: [' + formatPickCode(pair.score, true) + '] → ' + (pair.score === pair.item.top1 ? '<strong style="color:#4ade80;">✅ 鉄板1点的中！</strong>' : '<strong style="color:#f87171;">❌ 外れ</strong>'))
                    : '結果待ち');
              g3SolidRows.push(
                '<div class="compact-match-row">' +
                  '<div><strong>枠' + escapeHtml(pair.item.fNum) + '：' + escapeHtml(pair.item.label) + '</strong>（GOAL3本命: [' + formatPickCode(pair.item.top1, true) + '] 確率' + pair.item.p1 + '%）</div>' +
                  '<div>' + resTxt + '</div>' +
                '</div>'
              );
            });
          });
        }

        var sMetricTxt = sTotal > 0 ? (sHit + ' / ' + sTotal + ' 試合') : '該当なし（0枠）';
        var g3MetricTxt = g3STotalFin > 0 ? (g3SHit + ' / ' + g3STotalFin + ' 枠') : '該当なし（0枠）';
        var metricsHtml = totalFin === 0
          ? '<div style="font-size:12.5px; color:#94a3b8; margin:8px 0;">⏳ 試合終了後に確定結果の的中率が集計されます。</div>'
          : '<div class="simple-metrics">' +
              '<span>🔥 1x2鉄板(S)的中: <strong class="green">' + sMetricTxt + '</strong></span>' +
              '<span>🔥 GOAL3鉄板(S)的中: <strong class="green">' + g3MetricTxt + '</strong></span>' +
              '<span>🎯 本命(1点)的中: <strong>' + hit1 + ' / ' + totalFin + ' 試合</strong></span>' +
              '<span>⚡ 2点ダブル内的中: <strong class="gold">' + hit2 + ' / ' + totalFin + ' 試合</strong></span>' +
            '</div>';

        var sListHtml = sMatches.length === 0
          ? '<div style="font-size:13px; color:#94a3b8;">今節は絶対基準（スタメン判明・勝率55%以上・差25%以上）を満たす1x2鉄板試合がありません。</div>'
          : sMatches.map(function(x) {
              var a = actuals[String(x.f)];
              var resTxt = (a && a.res !== undefined && a.res !== null && a.res !== "")
                ? (isCancelledResult(a.res)
                    ? '<span style="color:#fbbf24;">⚠️ 中止</span>'
                    : ('確定: ' + escapeHtml(x.h) + ' ' + (parseValidScore(a.hs) !== null ? a.hs : '?') + '-' + (parseValidScore(a.as) !== null ? a.as : '?') + ' ' + escapeHtml(x.a) + ' → ' + (String(a.res) === x.c1x2.top1 ? '<strong style="color:#4ade80;">✅ 鉄板1点的中！</strong>' : '<strong style="color:#f87171;">❌ 波乱外れ</strong>')))
                : '結果待ち';
              return '<div class="compact-match-row"><div><strong>第' + x.f + '枠：' + escapeHtml(x.h) + ' vs ' + escapeHtml(x.a) + '</strong>（AI本命: [' + x.c1x2.top1 + '] 勝率' + x.c1x2.p1 + '%）</div><div>' + resTxt + '</div></div>';
            }).join("");

        var g3SolidHtml = g3SolidRows.length === 0
          ? '<div style="font-size:13px; color:#94a3b8;">今節は絶対基準を満たすGOAL3鉄板枠がありません。</div>'
          : g3SolidRows.join("");

        revEl.innerHTML =
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">📊 今節のシンプル振り返り' + (totalFin > 0 ? '（確定 ' + totalFin + '試合）' : '（開催前・進行中）') + '</div>' +
            metricsHtml +
            '<div style="font-size:13px; font-weight:bold; color:#f8fafc; margin:12px 0 6px;">🔥 認定された「絶対鉄板（Sランク）」一覧（mini toto / toto）</div>' +
            sListHtml +
            '<div style="font-size:13px; font-weight:bold; color:#f8fafc; margin:14px 0 6px;">🔥 認定された「絶対鉄板（Sランク）」一覧（toto GOAL3）</div>' +
            g3SolidHtml +
          '</div>';
      }

      function renderRound(roundKey) {
        if (!appData || !appData.rounds || !appData.rounds[roundKey]) return;
        currentRoundKey = roundKey;
        var rObj = appData.rounds[roundKey];
        currentRoundObj = rObj;

        var matches = (rObj.matches || []).slice().sort(function(a, b) {
          return (parseInt(a.f, 10) || 0) - (parseInt(b.f, 10) || 0);
        });
        var actuals = getEffectiveActualResults(roundKey, rObj.actual_results);

        document.getElementById("round-title-badge").textContent = rObj.title || roundKey;
        document.getElementById("last-updated-text").textContent = "最終取得: " + (appData.last_updated || "-");

        var ctxList = analyzeMatchContextList(matches, appData.last_updated || "");

        var analyzed = matches.map(function(m, idx) {
          var hLam = safeParseXg(m.h_xg);
          var aLam = safeParseXg(m.a_xg);
          var ctx = ctxList[idx];
          return {
            f: m.f, h: m.h, a: m.a, v: m.v || [34, 32, 34], hLam: hLam, aLam: aLam,
            ctx: ctx,
            c1x2: calc1x2DynamicDC(hLam, aLam, m.v, ctx, m.h + " vs " + m.a, m.f),
            gH: calcGoalTop2(hLam, ctx, true, m.h + "(H)", m.f + "H"),
            gA: calcGoalTop2(aLam, ctx, false, m.a + "(A)", m.f + "A")
          };
        });
        lastAnalyzedCache = analyzed;

        var configs = [];
        lastConfigsMap = {};
        if (isGameAvailable("mini_a", analyzed.length)) {
          var maItems = analyzed.slice(0, 5).map(function(x) { return x.c1x2; });
          configs.push({
            id: "mini_a",
            shortName: "① mini toto A組（1〜5枠）",
            title: "① mini toto A組（第1〜5枠）",
            items: maItems,
            gameType: "mini_a",
            metrics: evaluatePlanMetrics(maItems, selectedMode, "mini_a")
          });
        }
        if (isGameAvailable("mini_b", analyzed.length)) {
          var mbItems = analyzed.slice(5, 10).map(function(x) { return x.c1x2; });
          configs.push({
            id: "mini_b",
            shortName: "② mini toto B組（6〜10枠）",
            title: "② mini toto B組（第6〜10枠）",
            items: mbItems,
            gameType: "mini_b",
            metrics: evaluatePlanMetrics(mbItems, selectedMode, "mini_b")
          });
        }
        var g3Matches = isGameAvailable("goal3", analyzed.length) ? getGoal3Matches(analyzed, rObj) : [];
        if (g3Matches.length === 3) {
          var g3Items = [];
          g3Matches.forEach(function(x) { g3Items.push(x.gH); g3Items.push(x.gA); });
          var g3FrameLabel = g3Matches.map(function(x) { return x.f; }).join("・");
          configs.push({
            id: "goal3",
            shortName: "③ toto GOAL3（第" + g3FrameLabel + "枠）",
            title: "③ toto GOAL3（第" + g3FrameLabel + "枠の6チーム得点）",
            items: g3Items,
            gameType: "goal3",
            metrics: evaluatePlanMetrics(g3Items, selectedMode, "goal3")
          });
        }
        if (isGameAvailable("toto_main", analyzed.length)) {
          var all1x2 = analyzed.map(function(x) { return x.c1x2; });
          configs.push({
            id: "toto_main",
            shortName: "④ toto 本戦（全" + analyzed.length + "枠）",
            title: "④ toto 本戦（全" + analyzed.length + "枠・参考）",
            items: all1x2,
            gameType: "toto_main",
            metrics: evaluatePlanMetrics(all1x2, selectedMode, "toto_main")
          });
        }
        configs.forEach(function(c) { lastConfigsMap[c.gameType] = c; });

        var recCandidates = configs.filter(function(c) {
          return c.gameType !== "toto_main" && !c.metrics.isSkipRecommended;
        }).sort(function(a, b) { return b.metrics.recScore - a.metrics.recScore; });
        var bestId = recCandidates.length > 0 ? recCandidates[0].id : "";

        var unannCount = analyzed.filter(function(x) { return !x.ctx.isLineupAnnounced; }).length;
        var alertEl = document.getElementById("global-alert-area");
        if (recCandidates.length === 0) {
          var reasonMsg = unannCount > 0
            ? "現在スタメン未発表の試合が " + unannCount + "試合 あるため、絶対鉄板(S)が確定していません。キックオフ直前（スタメン発表後）に「⚡ 再読込」をして再確認してください。"
            : "今節は絶対基準を満たす鉄板枠が全くじ種で不足しています。損失回避のため見送り（ケン）をおすすめします。";
          alertEl.innerHTML =
            '<div class="global-alert-banner"><strong>⚠️ 今節は見送り推奨（購入候補なし）</strong>：' + reasonMsg + '</div>';
        } else {
          alertEl.innerHTML = "";
        }

        document.getElementById("marksheet-summary-grid").innerHTML = configs.map(function(cfg) {
          var role = cfg.id === bestId ? "best" : "";
          return buildMarksheetCardHtml(cfg, role);
        }).join("");

        document.getElementById("plans-detail-list").innerHTML = configs.map(function(cfg) {
          return buildDetailPlanCard(cfg);
        }).join("");

        /* 全試合根拠データ（紛らわしい固定推奨表記を廃し、純粋なランク＆AI3択勝率を表示） */
        var compactMatchesHtml = analyzed.map(function(x) {
          var r = x.c1x2.rank;
          var rBadge = r === "S"
            ? '<span class="f-rank-tag s">🔥 S:絶対鉄板</span>'
            : (r === "A" ? '<span class="f-rank-tag a">⚡ A:準鉄板</span>' : '<span class="f-rank-tag b">🌪️ B:混戦</span>');
          var stNote = !x.ctx.isLineupAnnounced ? " ⏳スタメン未発表" : " ✓スタメン判明";
          return (
            '<div class="compact-match-row">' +
              '<div><strong>第' + x.f + '枠</strong>：' + escapeHtml(x.h) + ' vs ' + escapeHtml(x.a) + '<span style="color:' + (!x.ctx.isLineupAnnounced ? '#fde047' : '#6ee7b7') + '; font-size:11px;">' + stNote + '</span></div>' +
              '<div style="display:flex; align-items:center; gap:8px;">' +
                rBadge +
                '<span>AI勝率 [1:' + x.c1x2.pctMap["1"] + '% / 0:' + x.c1x2.pctMap["0"] + '% / 2:' + x.c1x2.pctMap["2"] + '%]</span>' +
              '</div>' +
            '</div>'
          );
        }).join("");

        /* GOAL3 6チームの根拠データ（λ・得点確率・S/A/Bランク） */
        var g3DetailHtml = "";
        if (g3Matches.length === 3) {
          var g3Rows = [];
          g3Matches.forEach(function(x) {
            [x.gH, x.gA].forEach(function(gItem) {
              var gr = gItem.rank;
              var gBadge = gr === "S"
                ? '<span class="f-rank-tag s">🔥 S:絶対鉄板</span>'
                : (gr === "A" ? '<span class="f-rank-tag a">⚡ A:準鉄板</span>' : '<span class="f-rank-tag b">🌪️ B:混戦</span>');
              var stNote = !gItem.isLineupAnnounced ? " ⏳未発表" : " ✓判明";
              g3Rows.push(
                '<div class="compact-match-row">' +
                  '<div><strong>枠' + escapeHtml(gItem.fNum) + '</strong>：' + escapeHtml(gItem.label) + '（λ=' + gItem.effLam.toFixed(2) + '）<span style="color:' + (!gItem.isLineupAnnounced ? '#fde047' : '#6ee7b7') + '; font-size:11px;">' + stNote + '</span></div>' +
                  '<div style="display:flex; align-items:center; gap:8px;">' +
                    gBadge +
                    '<span>[0:' + gItem.pctMap["0"] + '% / 1:' + gItem.pctMap["1"] + '% / 2:' + gItem.pctMap["2"] + '% / 3+:' + gItem.pctMap["3"] + '%]</span>' +
                  '</div>' +
                '</div>'
              );
            });
          });
          g3DetailHtml =
            '<details class="clean-details">' +
              '<summary>🥅 toto GOAL3 対象6チームの期待得点(λ)＆S/A/Bランクデータを見る</summary>' +
              '<div class="details-body">' + g3Rows.join("") + '</div>' +
            '</details>';
        }

        document.getElementById("matches-detail-area").innerHTML =
          '<details class="clean-details">' +
            '<summary>⚽ 全' + analyzed.length + '試合のS/A/Bランク＆AI勝率データを見る</summary>' +
            '<div class="details-body">' + compactMatchesHtml + '</div>' +
          '</details>' +
          g3DetailHtml;

        document.querySelectorAll(".register-plan-btn").forEach(function(rBtn) {
          rBtn.addEventListener("click", function() {
            var gType = rBtn.getAttribute("data-reg-game");
            registerAiPlanToMyBets(gType, selectedMode);
          });
        });

        document.querySelectorAll(".copy-picks-btn").forEach(function(cBtn) {
          cBtn.addEventListener("click", function() {
            var gType = cBtn.getAttribute("data-copy-game");
            var cfg = lastConfigsMap[gType];
            if (!cfg || !cfg.metrics || !cfg.metrics.ticketGroups.length) return;
            var isG3 = (gType === "goal3");
            var copyLines = [cfg.shortName + "（計 " + formatYen(cfg.metrics.cost) + "）"];
            cfg.metrics.ticketGroups.forEach(function(grp, idx) {
              var prefix = cfg.metrics.ticketGroups.length > 1 ? ("シート" + (idx + 1) + ": ") : "";
              var line = grp.picks.map(function(ch) { return formatPickChoices(ch, isG3); }).join("-");
              copyLines.push(prefix + line);
            });
            copyTextToClipboard(copyLines.join("\n"), cBtn);
          });
        });

        try { renderResultsTabSection(analyzed, actuals, rObj); } catch (e1) { console.error(e1); }
        try { renderReviewTabSection(analyzed, actuals, rObj); } catch (e2) { console.error(e2); }
      }

      /* 厳格な手動入力バリデーション（全角・3+表記・空白＋ハイフン対応・重複排除・許可数字チェック） */
      function parseUserPickInput(rawStr, expectedFrames, gameType) {
        var normalized = (rawStr || "")
          .replace(/[０-９]/g, function(ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
          .replace(/3[+＋]/g, "3")
          .replace(/／/g, "/")
          .replace(/\s*\/\s*/g, "/")
          .trim()
          .replace(/[-－ー〜~\s,、]+/g, "-")
          .replace(/^-+|-+$/g, "");
        if (!normalized) return null;

        var parts = normalized.indexOf("-") !== -1 ? normalized.split("-") : normalized.split("");
        if (parts.length !== expectedFrames) return null;

        var allowed = (gameType === "goal3") ? ["0", "1", "2", "3"] : ["1", "0", "2"];
        var picks = [];
        var combos = 1;

        for (var i = 0; i < parts.length; i++) {
          var rawTokens = parts[i].split("/").map(function(s) { return s.trim(); }).filter(function(s) { return s !== ""; });
          var uniqueValid = [];
          for (var j = 0; j < rawTokens.length; j++) {
            var t = rawTokens[j];
            if (allowed.indexOf(t) === -1) return null;
            if (uniqueValid.indexOf(t) === -1) uniqueValid.push(t);
          }
          if (uniqueValid.length === 0) return null;
          picks.push(uniqueValid);
          combos *= uniqueValid.length;
        }
        return { picks: picks, cost: combos * 100 };
      }

      function handleManualBetAdd() {
        var gType = document.getElementById("my-bet-type").value;
        if (!isGameAvailable(gType, lastAnalyzedCache.length)) {
          alert("この開催回では選択されたくじ種は対象外です。");
          return;
        }
        var rawPicks = document.getElementById("my-bet-picks").value;
        var memo = document.getElementById("my-bet-label").value.trim();
        var expLen = (gType === "mini_a" || gType === "mini_b") ? 5 : (gType === "goal3" ? 6 : 13);

        var parsed = parseUserPickInput(rawPicks, expLen, gType);
        if (!parsed) {
          var validChars = gType === "goal3" ? "0, 1, 2, 3（3+可）" : "1, 0, 2";
          alert("入力形式が正しくありません。" + expLen + "枠分を「" + validChars + "」のみを使いハイフン区切り（例: 1-0-1/2-1-2）で入力してください。");
          return;
        }
        var list = loadMyBets(currentRoundKey);
        var sig = gType + "|" + serializePicks(parsed.picks);
        var dup = list.some(function(b) { return (b.gameType + "|" + serializePicks(b.picks)) === sig; });
        if (dup) {
          alert("同じ買い目がすでに登録されています。");
          return;
        }
        list.push({
          id: "bet_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
          gameType: gType,
          label: memo || "手動登録",
          picks: parsed.picks,
          cost: parsed.cost
        });
        saveMyBets(currentRoundKey, list);
        document.getElementById("my-bet-picks").value = "";
        document.getElementById("my-bet-label").value = "";
        if (currentRoundKey) renderRound(currentRoundKey);
      }

      function initMyBetEvents() {
        var addBtn = document.getElementById("my-bet-add-btn");
        if (addBtn) addBtn.addEventListener("click", handleManualBetAdd);

        var betTypeSel = document.getElementById("my-bet-type");
        if (betTypeSel) betTypeSel.addEventListener("change", updateManualInputPlaceholder);

        var picksInput = document.getElementById("my-bet-picks");
        if (picksInput) {
          picksInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") handleManualBetAdd();
          });
        }

        document.querySelectorAll(".preset-btn").forEach(function(pBtn) {
          pBtn.addEventListener("click", function() {
            var gType = pBtn.getAttribute("data-preset");
            registerAiPlanToMyBets(gType, selectedMode);
          });
        });

        var clearBtn = document.getElementById("clear-my-bets-btn");
        if (clearBtn) {
          clearBtn.addEventListener("click", function() {
            var current = loadMyBets(currentRoundKey);
            if (!current || current.length === 0) return;
            if (!confirm("この開催回の登録済み買い目（" + current.length + "件）をすべて削除しますか？")) return;
            saveMyBets(currentRoundKey, []);
            if (currentRoundKey) renderRound(currentRoundKey);
          });
        }
      }

      function applyData(data) {
        appData = data;
        var sel = document.getElementById("round-select");
        sel.innerHTML = "";
        var keys = Object.keys((data && data.rounds) || {});
        if (keys.length === 0) {
          document.getElementById("round-title-badge").textContent = "開催回データなし";
          document.getElementById("marksheet-summary-grid").innerHTML =
            '<div class="empty-msg">表示できる開催回データがありません。</div>';
          return;
        }
        keys.forEach(function(k) {
          var opt = document.createElement("option");
          opt.value = k; opt.textContent = k;
          if (k === data.current_round) opt.selected = true;
          sel.appendChild(opt);
        });
        var activeKey = (data.current_round && data.rounds[data.current_round]) ? data.current_round : keys[0];
        if (activeKey) renderRound(activeKey);
      }

      function loadAllData() {
        if (window.__EMBEDDED_TOTO_DATA__ && window.__EMBEDDED_TOTO_DATA__.rounds) {
          applyData(window.__EMBEDDED_TOTO_DATA__);
          return;
        }
        fetch("data.json?t=" + Date.now(), { cache: "no-store" })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function(d) { applyData(d); })
          .catch(function(err) {
            document.getElementById("round-title-badge").textContent = "データ読込エラー";
            document.getElementById("marksheet-summary-grid").innerHTML =
              '<div class="empty-msg">最新データの取得に失敗しました（' + escapeHtml(err.message) + '）。「⚡ 再読込」を押してください。</div>';
          });
      }

      document.getElementById("round-select").addEventListener("change", function(e) {
        renderRound(e.target.value);
      });
      document.querySelectorAll(".tab-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
          document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.add("hidden"); });
          btn.classList.add("active");
          document.getElementById(btn.getAttribute("data-tab")).classList.remove("hidden");
        });
      });
      document.querySelectorAll(".budget-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".budget-btn").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          var bAttr = btn.getAttribute("data-budget");
          selectedMode = (bAttr === "smart") ? "smart" : (parseInt(bAttr, 10) || 500);
          if (currentRoundKey) renderRound(currentRoundKey);
        });
      });

      initMyBetEvents();
      initAuth();
    })();
  </script>
</body>
</html>
