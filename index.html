<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>toto AI Manager - 公式マークシート早見表＆結果照合</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1120; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.45; padding: 12px;
    }
    .container { max-width: 980px; margin: 0 auto; }

    /* PINロック画面 */
    #pin-overlay {
      position: fixed; inset: 0; background: #0b1120;
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .pin-box {
      background: #111827; border: 1px solid #334155; border-radius: 14px;
      padding: 28px; width: 90%; max-width: 350px; text-align: center;
    }
    .pin-box h2 { font-size: 18px; margin-bottom: 8px; color: #f8fafc; }
    .pin-box p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .pin-input {
      width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 6px;
      background: #1e293b; border: 1px solid #475569; border-radius: 8px; color: #fff; margin-bottom: 12px;
    }
    .pin-btn {
      width: 100%; padding: 12px; background: #f97316; border: none; border-radius: 8px;
      color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .pin-err { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 18px; }

    /* ヘッダー */
    .header-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 12px;
      padding: 12px 16px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .round-badge {
      display: inline-block; background: #f97316; color: #fff; font-weight: bold;
      font-size: 12.5px; padding: 4px 12px; border-radius: 999px; margin-bottom: 4px;
    }
    .last-updated { font-size: 11px; color: #94a3b8; }
    .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select.round-select {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 7px 10px; border-radius: 8px; font-size: 12.5px; font-weight: bold;
    }
    .reload-btn {
      background: #2563eb; color: #fff; border: none; padding: 7px 13px;
      border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    /* 3タブナビゲーション */
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      background: #111827; color: #cbd5e1; border: 1px solid #1f2937;
      padding: 11px 6px; border-radius: 10px; font-size: 13.5px; font-weight: bold;
      cursor: pointer; text-align: center; transition: 0.15s;
    }
    .tab-btn.active { background: #f97316; color: #fff; border-color: #f97316; }

    /* 最上部：当日購入コントロールバー */
    .top-control-bar {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 10px 14px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .budget-switch {
      display: inline-flex; flex-wrap: wrap; background: #0b1120; border: 1px solid #334155;
      border-radius: 8px; padding: 3px; gap: 3px;
    }
    .budget-btn {
      background: transparent; color: #94a3b8; border: none;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; transition: 0.15s;
    }
    .budget-btn.active { background: #10b981; color: #052e16; }
    .official-link-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: #059669; color: #fff; text-decoration: none;
      padding: 7px 13px; border-radius: 8px; font-size: 12px; font-weight: bold;
    }
    .official-link-btn:hover { background: #047857; }

    /* マークシート見出し */
    .sheet-section-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    }
    .sheet-section-title { font-size: 15.5px; font-weight: 900; color: #4ade80; }
    .sheet-legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #cbd5e1; }

    /* マークシート2列グリッド */
    .marksheet-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    @media (max-width: 760px) { .marksheet-grid { grid-template-columns: 1fr; } }

    .ms-card {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .ms-card.rec {
      border: 2px solid #10b981;
      background: linear-gradient(180deg, rgba(6, 78, 59, 0.25) 0%, #111827 30%);
    }
    .ms-card.skip { opacity: 0.85; border-color: #374151; }
    .ms-top {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 6px; flex-wrap: wrap;
    }
    .ms-title { font-size: 14.5px; font-weight: 900; color: #f8fafc; }
    .ms-cost {
      background: #0f172a; color: #fbbf24; border: 1px solid #f59e0b;
      font-size: 12px; font-weight: bold; padding: 2px 9px; border-radius: 999px;
    }
    .ms-status-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 11.5px;
    }
    .ms-pill { padding: 2px 8px; border-radius: 5px; font-weight: bold; font-size: 11px; }
    .ms-pill.rec { background: #059669; color: #fff; }
    .ms-pill.ok { background: #1e3a8a; color: #93c5fd; }
    .ms-pill.skip { background: #78350f; color: #fde68a; }
    .ms-pill.ref { background: #1f2937; color: #9ca3af; }

    .sheet-sub-label {
      font-size: 11px; font-weight: bold; color: #38bdf8;
      margin: 8px 0 4px; display: flex; justify-content: space-between;
    }
    .sheet-sub-label:first-of-type { margin-top: 2px; }

    /* 公式投票画面そのままのマークシートテーブル */
    .ms-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
      background: #0b1120; border-radius: 8px; overflow: hidden;
      margin-bottom: 6px;
    }
    .ms-table th {
      background: #1e293b; color: #94a3b8; font-size: 11px; font-weight: bold;
      padding: 4px 3px; text-align: center; border-bottom: 1px solid #334155;
    }
    .ms-table th.col-match { text-align: left; padding-left: 8px; }
    .ms-table td {
      padding: 4px 3px; border-bottom: 1px solid #1e293b; text-align: center;
    }
    .ms-table tr:last-child td { border-bottom: none; }
    .ms-table td.col-frame { font-weight: bold; color: #94a3b8; width: 30px; font-size: 11px; }
    .ms-table td.col-match {
      text-align: left; padding-left: 6px; color: #e2e8f0; font-weight: bold;
      font-size: 11.5px; white-space: nowrap;
    }

    /* 公式toto風の塗りつぶし楕円 */
    .oval {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 21px; border-radius: 999px;
      font-size: 11.5px; font-weight: 900; border: 1px solid #334155;
      color: #475569; background: #0f172a;
    }
    .oval.on-s {
      background: #dc2626; border-color: #fca5a5; color: #ffffff;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.55);
    }
    .oval.on-a { background: #0284c7; border-color: #7dd3fc; color: #ffffff; }
    .oval.on-b { background: #d97706; border-color: #fde68a; color: #ffffff; }

    .ms-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; padding-top: 7px; border-top: 1px dashed #334155;
      font-size: 11.5px; color: #94a3b8;
    }
    .register-plan-btn {
      background: #2563eb; color: #fff; border: none;
      padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .register-plan-btn:hover { background: #1d4ed8; }

    /* 区切り見出し（ここから下は細かい情報） */
    .detail-divider {
      margin: 24px 0 12px; padding: 10px 14px;
      background: #111827; border-left: 4px solid #38bdf8; border-radius: 6px;
      font-size: 14.5px; font-weight: bold; color: #38bdf8;
    }

    /* 詳細カード・折りたたみ */
    .plan-card {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .plan-title { font-size: 14.5px; font-weight: bold; color: #f8fafc; }
    .simple-metrics {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 12px; margin: 8px 0; font-size: 12px; color: #cbd5e1;
    }
    .simple-metrics strong { color: #f8fafc; }
    .simple-metrics .gold { color: #fbbf24; font-weight: bold; }
    .simple-metrics .green { color: #4ade80; font-weight: bold; }

    .ticket-box { background: #1e293b; border-radius: 8px; padding: 8px 12px; margin-top: 6px; }
    .ticket-label { font-size: 11px; color: #fbbf24; font-weight: bold; margin-bottom: 3px; }
    .ticket-line { font-size: 13.5px; font-weight: bold; color: #f8fafc; letter-spacing: 1px; }
    .super-solid { display: inline-block; background: #dc2626; color: #fff; font-weight: 900; padding: 0 6px; border-radius: 4px; }
    .w-pair { display: inline-block; color: #fbbf24; background: rgba(251, 191, 36, 0.18); padding: 0 5px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.4); }

    .f-rank-tag { display: inline-block; font-size: 10.5px; font-weight: bold; padding: 1px 6px; border-radius: 4px; }
    .f-rank-tag.s { background: #dc2626; color: #fff; }
    .f-rank-tag.a { background: #0284c7; color: #fff; }
    .f-rank-tag.b { background: #ca8a04; color: #fff; }

    details.clean-details {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    details.clean-details summary {
      font-size: 13.5px; font-weight: bold; color: #e2e8f0; cursor: pointer;
      list-style: none; display: flex; justify-content: space-between; align-items: center;
    }
    details.clean-details summary::-webkit-details-marker { display: none; }
    details.clean-details summary::after { content: "▼ 開く"; font-size: 11.5px; color: #38bdf8; }
    details.clean-details[open] summary::after { content: "▲ 閉じる"; }
    .details-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid #1e293b; }

    .compact-match-row {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 6px; padding: 8px 6px;
      border-bottom: 1px solid #1e293b; font-size: 12.5px;
    }
    .compact-match-row:last-child { border-bottom: none; }

    /* 結果照合・マイ購入登録 */
    .res-hit-token { display: inline-block; background: #065f46; color: #6ee7b7; border: 1px solid #10b981; font-weight: 900; padding: 1px 7px; border-radius: 5px; }
    .res-miss-token { display: inline-block; background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; padding: 1px 7px; border-radius: 5px; opacity: 0.85; }
    .res-wait-token { display: inline-block; background: #1e293b; color: #94a3b8; border: 1px solid #475569; padding: 1px 7px; border-radius: 5px; }
    .tier-badge { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 5px; }
    .tier-badge.t1 { background: #b45309; color: #fef3c7; border: 1px solid #f59e0b; }
    .tier-badge.t2 { background: #1e3a8a; color: #dbeafe; border: 1px solid #60a5fa; }
    .tier-badge.t3 { background: #065f46; color: #d1fae5; border: 1px solid #34d399; }
    .tier-badge.miss { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }

    .my-bet-panel { background: #111827; border: 2px solid #f59e0b; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .my-bet-title { font-size: 14.5px; font-weight: bold; color: #fbbf24; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .my-bet-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
    .my-bet-select, .my-bet-input, .my-bet-memo { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 7px 10px; border-radius: 6px; font-size: 12.5px; font-weight: bold; }
    .my-bet-input { flex: 1; min-width: 190px; }
    .my-bet-memo { width: 130px; font-weight: normal; }
    .my-bet-add-btn { background: #f97316; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .preset-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
    .preset-btn { background: #1e3a8a; color: #dbeafe; border: 1px solid #3b82f6; padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .clear-bets-btn { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
    .my-ticket-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .my-ticket-item.win-item { border: 2px solid #10b981; }
    .del-ticket-btn { background: transparent; color: #94a3b8; border: 1px solid #475569; padding: 2px 7px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    .tier-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tier-table th { text-align: left; color: #94a3b8; padding: 6px; border-bottom: 1px solid #1e293b; }
    .tier-table td { padding: 7px 6px; border-bottom: 1px solid #1e293b; }

    .hidden { display: none !important; }
    .empty-msg { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 18px; text-align: center; color: #94a3b8; font-size: 13.5px; }
  </style>
</head>
<body>

  <!-- PINロック画面 -->
  <div id="pin-overlay" class="hidden">
    <div class="pin-box">
      <h2>toto AI Manager</h2>
      <p>アクセスPINを入力してください</p>
      <input type="password" id="pin-input" class="pin-input" maxlength="12" placeholder="••••" />
      <button id="pin-submit" class="pin-btn">ロック解除</button>
      <div id="pin-err" class="pin-err"></div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app" class="container hidden">
    <div class="header-card">
      <div>
        <div id="round-title-badge" class="round-badge">最新データ読み込み中...</div>
        <div id="last-updated-text" class="last-updated">最終取得: -</div>
      </div>
      <div class="header-controls">
        <select id="round-select" class="round-select"></select>
        <button id="reload-btn" class="reload-btn" onclick="window.reloadLatestData()">⚡ 再読込</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab1">📝 ① 提案・マークシート</button>
      <button class="tab-btn" data-tab="tab2">🏁 ② 結果・答え合わせ</button>
      <button class="tab-btn" data-tab="tab3">📈 ③ 振り返り</button>
    </div>

    <!-- タブ1: 提案・マークシート（最上部に即購入用シート、下部に細かい情報） -->
    <div id="tab1" class="tab-content">
      <!-- 1. 最上部：予算モード切替＆公式サイトリンク -->
      <div class="top-control-bar">
        <div class="budget-switch">
          <button id="btn-budget-smart" class="budget-btn active" data-budget="smart">⚡ AI強弱マルチ</button>
          <button id="btn-budget-500" class="budget-btn" data-budget="500">500円</button>
          <button id="btn-budget-1000" class="budget-btn" data-budget="1000">1,000円</button>
          <button id="btn-budget-1500" class="budget-btn" data-budget="1500">1,500円</button>
          <button id="btn-budget-2000" class="budget-btn" data-budget="2000">2,000円</button>
        </div>
        <a href="https://www.toto-dream.com/" target="_blank" rel="noopener noreferrer" class="official-link-btn">🌐 toto公式サイトを開く ↗</a>
      </div>

      <!-- 2. 公式マークシート早見表（mini toto A/B・GOAL3・toto本戦の4種を即マーク可能に） -->
      <div class="sheet-section-header">
        <div class="sheet-section-title">📝 公式マークシート早見表（色付きマスをそのままタップして購入）</div>
        <div class="sheet-legend">
          <span class="oval on-s" style="width:auto; padding:0 6px; font-size:10px;">赤＝1点固定</span>
          <span class="oval on-a" style="width:auto; padding:0 6px; font-size:10px;">青＝2点W</span>
          <span class="oval on-b" style="width:auto; padding:0 6px; font-size:10px;">黄＝3点全押</span>
        </div>
      </div>
      <div id="marksheet-summary-grid" class="marksheet-grid"></div>

      <!-- 3. ここから下は細かい情報 -->
      <div class="detail-divider">📊 ここから下は細かい情報（当選確率・想定配当・期待値・全試合データ）</div>
      <div id="plans-detail-list"></div>
      <div id="matches-detail-area"></div>
    </div>

    <!-- タブ2: 結果・答え合わせ -->
    <div id="tab2" class="tab-content hidden">
      <div class="my-bet-panel">
        <div class="my-bet-title">
          <span>📝 購入した買い目の登録＆自動答え合わせ</span>
          <button type="button" id="clear-my-bets-btn" class="clear-bets-btn">🗑️ 全削除</button>
        </div>
        <div class="my-bet-form">
          <select id="my-bet-type" class="my-bet-select">
            <option value="mini_a">mini toto A組（5枠）</option>
            <option value="mini_b">mini toto B組（5枠）</option>
            <option value="goal3">toto GOAL3（6枠）</option>
            <option value="toto_main">toto 本戦（13枠）</option>
          </select>
          <input type="text" id="my-bet-picks" class="my-bet-input" placeholder="例: 1 - 1/0 - 2 - 1/0/2 - 1" />
          <input type="text" id="my-bet-label" class="my-bet-memo" placeholder="メモ（任意）" />
          <button type="button" id="my-bet-add-btn" class="my-bet-add-btn">＋ 追加</button>
        </div>
        <div class="preset-bar">
          <span style="font-size:11px; color:#94a3b8; font-weight:bold;">⚡ 現在のマークシートをワンタップ登録：</span>
          <button type="button" class="preset-btn" data-preset="mini_a">＋ mini A組</button>
          <button type="button" class="preset-btn" data-preset="mini_b">＋ mini B組</button>
          <button type="button" class="preset-btn" data-preset="goal3">＋ GOAL3</button>
          <button type="button" class="preset-btn" data-preset="toto_main">＋ toto本戦</button>
        </div>
        <div id="my-bets-result-list"></div>
      </div>

      <div id="results-list"></div>
    </div>

    <!-- タブ3: 振り返り -->
    <div id="tab3" class="tab-content hidden">
      <div id="review-list"></div>
    </div>

      var EXPECTED_HASH = "369ee7f5fa956a81ceac1073da074b7d523d9264e3780e606e06d717830b8d60";
      var appData = window.__EMBEDDED_TOTO_DATA__ || null;
      var currentRoundKey = "";
      var selectedMode = "smart";
      var lastAnalyzedCache = [];

      var FALLBACK_ACTUAL_RESULTS = {
        "1672": {
          "1": { "hs": 1, "as": 1, "res": "0" },
          "2": { "hs": 1, "as": 1, "res": "0" },
          "3": { "hs": 3, "as": 2, "res": "1" },
          "4": { "hs": 5, "as": 4, "res": "1" },
          "5": { "hs": 1, "as": 3, "res": "2" },
          "6": { "hs": 1, "as": 6, "res": "2" },
          "7": { "hs": 1, "as": 2, "res": "2" },
          "8": { "hs": 4, "as": 0, "res": "1" },
          "9": { "hs": 0, "as": 2, "res": "2" },
          "10": { "hs": 2, "as": 3, "res": "2" },
          "11": { "hs": 2, "as": 2, "res": "0" },
          "12": { "hs": 1, "as": 0, "res": "1" },
          "13": { "hs": 2, "as": 1, "res": "1" }
        }
      };

      window.reloadLatestData = function() {
        window.location.replace(window.location.pathname + "?r=" + Date.now());
      };

      function sha256Hex(str) {
        var enc = new TextEncoder().encode(str);
        return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
          return Array.from(new Uint8Array(buf)).map(function(b) {
            return b.toString(16).padStart(2, "0");
          }).join("");
        });
      }

      function unlockApp() {
        document.getElementById("pin-overlay").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        loadAllData();
      }

      function initAuth() {
        if (EXPECTED_HASH === "369ee7f5fa956a81ceac1073da074b7d523d9264e3780e606e06d717830b8d60" || EXPECTED_HASH === "") {
          unlockApp();
          return;
        }
        if (localStorage.getItem("toto_auth_ok") === EXPECTED_HASH) {
          unlockApp();
          return;
        }
        document.getElementById("pin-overlay").classList.remove("hidden");
        document.getElementById("pin-submit").addEventListener("click", function() {
          var val = document.getElementById("pin-input").value || "";
          sha256Hex(val).then(function(h) {
            if (h === EXPECTED_HASH) {
              localStorage.setItem("toto_auth_ok", h);
              unlockApp();
            } else {
              document.getElementById("pin-err").textContent = "PINが正しくありません";
            }
          });
        });
      }

      function formatYen(num) {
        return Math.round(num).toLocaleString("ja-JP") + "円";
      }

      function formatFreqText(probPct) {
        if (!probPct || probPct <= 0) return "";
        var times = Math.max(1.1, 100 / probPct);
        if (times >= 10) return "約" + Math.round(times).toLocaleString("ja-JP") + "回に1回";
        return "約" + times.toFixed(1) + "回に1回";
      }

      function getRoundIdNumber(roundKey) {
        var m = (roundKey || "").match(/第(\d{4})回/);
        return m ? m[1] : (roundKey || "default");
      }

      function getEffectiveActualResults(roundKey, rawActuals) {
        var merged = {};
        var rid = getRoundIdNumber(roundKey);
        if (FALLBACK_ACTUAL_RESULTS[rid]) {
          var fb = FALLBACK_ACTUAL_RESULTS[rid];
          Object.keys(fb).forEach(function(k) {
            merged[k] = { hs: fb[k].hs, as: fb[k].as, res: fb[k].res };
          });
        }
        if (rawActuals && typeof rawActuals === "object") {
          Object.keys(rawActuals).forEach(function(k) {
            var v = rawActuals[k];
            if (v && typeof v === "object" && v.res !== undefined) {
              merged[k] = v;
            }
          });
        }
        return merged;
      }

      function loadMyBets(roundKey) {
        var rid = getRoundIdNumber(roundKey);
        try {
          var raw = localStorage.getItem("toto_my_bets_" + rid);
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }

      function saveMyBets(roundKey, list) {
        var rid = getRoundIdNumber(roundKey);
        try {
          localStorage.setItem("toto_my_bets_" + rid, JSON.stringify(list || []));
        } catch (e) {}
      }

      function analyzeMatchContextList(matches, lastUpdatedStr) {
        var refDate = new Date();
        if (lastUpdatedStr) {
          var mUp = lastUpdatedStr.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
          if (mUp) {
            var parsedUp = new Date(
              parseInt(mUp[1], 10), parseInt(mUp[2], 10) - 1, parseInt(mUp[3], 10),
              parseInt(mUp[4], 10), parseInt(mUp[5], 10)
            );
            if (parsedUp > refDate) refDate = parsedUp;
          }
        }
        var refYear = refDate.getFullYear();

        var rawDates = matches.map(function(m) {
          var txt = m.analysis || "";
          var md = txt.match(/(\d{1,2})月(\d{1,2})日/);
          if (!md) return null;
          var mon = parseInt(md[1], 10), day = parseInt(md[2], 10);
          return { tag: mon + "月" + day + "日", mon: mon, day: day, val: mon * 100 + day };
        });

        var validDates = rawDates.filter(function(d) { return d !== null; });
        var hasDec = validDates.some(function(d) { return d.mon === 12; });
        var hasJan = validDates.some(function(d) { return d.mon === 1; });

        var uniqueMap = {};
        validDates.forEach(function(d) {
          uniqueMap[d.tag] = (hasDec && hasJan && d.mon === 1) ? (1300 + d.day) : d.val;
        });
        var sortedTags = Object.keys(uniqueMap).sort(function(a, b) { return uniqueMap[a] - uniqueMap[b]; });
        var firstDateTag = sortedTags.length > 0 ? sortedTags[0] : "";
        var hasMultipleDays = sortedTags.length >= 2;

        return matches.map(function(m, idx) {
          var txt = m.analysis || "";
          var dInfo = rawDates[idx];
          var isSecondCalendarDay = (hasMultipleDays && dInfo && dInfo.tag !== firstDateTag);

          var koMatch = txt.match(/(\d{1,2}:\d{2})(?:KO)?/);
          var koStr = koMatch ? koMatch[1] : "";

          var hPct = 0, aPct = 0;
          var hm = txt.match(/H:([^/\]]*?\(([+-±]?\d+)%\))/);
          if (hm) hPct = parseInt(hm[2].replace("±", ""), 10) || 0;
          var am = txt.match(/A:([^/\])\]]*?\(([+-±]?\d+)%\))/);
          if (am) aPct = parseInt(am[2].replace("±", ""), 10) || 0;

          var hasAnnouncedText = (txt.indexOf("スタメン発表済") !== -1) || (hm !== null) || (am !== null);
          var hasUnannouncedText = (txt.indexOf("スタメン未発表") !== -1);

          var timeBasedAnnounced = false;
          if (dInfo) {
            var koH = 14, koM = 0;
            if (koStr) {
              var parts = koStr.split(":");
              koH = parseInt(parts[0], 10); koM = parseInt(parts[1], 10);
            }
            var koDate = new Date(refYear, dInfo.mon - 1, dInfo.day, koH, koM);
            var diffMinutes = (refDate.getTime() - koDate.getTime()) / 60000;
            if (diffMinutes >= -130) timeBasedAnnounced = true;
          }

          var isLineupAnnounced = hasAnnouncedText || (!hasUnannouncedText && timeBasedAnnounced);
          var isUnannouncedRisk = isSecondCalendarDay && !isLineupAnnounced;

          return {
            dateTag: dInfo ? dInfo.tag : "",
            koStr: koStr,
            isSecondCalendarDay: isSecondCalendarDay,
            isLineupAnnounced: isLineupAnnounced,
            isUnannouncedRisk: isUnannouncedRisk,
            hPct: hPct,
            aPct: aPct
          };
        });
      }

      function poissonProbs(lam) {
        var p0 = Math.exp(-lam);
        var p1 = lam * p0;
        var p2 = (lam * lam / 2) * p0;
        var p3 = Math.max(0.01, 1 - (p0 + p1 + p2));
        return [p0, p1, p2, p3];
      }

      function calc1x2DynamicDC(hLam, aLam, mktV, ctx, labelTxt, fNum) {
        var effHLam = hLam, effALam = aLam;
        if (ctx && ctx.isLineupAnnounced && (ctx.hPct !== 0 || ctx.aPct !== 0)) {
          effHLam = Math.max(0.25, Math.min(3.50, hLam * (1 + (ctx.hPct * 0.008))));
          effALam = Math.max(0.25, Math.min(3.50, aLam * (1 + (ctx.aPct * 0.008))));
        }

        var totLam = effHLam + effALam;
        var rho = Math.max(-0.16, Math.min(-0.06, -0.12 + (totLam - 2.4) * 0.03));
        var hp = poissonProbs(effHLam), ap = poissonProbs(effALam);
        var p1 = 0, p0 = 0, p2 = 0;

        for (var i = 0; i < 4; i++) {
          for (var j = 0; j < 4; j++) {
            var p = hp[i] * ap[j];
            if (i === 0 && j === 0) p *= Math.max(0.1, 1 - effHLam * effALam * rho);
            else if (i === 1 && j === 0) p *= Math.max(0.1, 1 + effALam * rho);
            else if (i === 0 && j === 1) p *= Math.max(0.1, 1 + effHLam * rho);
            else if (i === 1 && j === 1) p *= Math.max(0.1, 1 - rho);
            if (i > j) p1 += p;
            else if (i === j) p0 += p;
            else p2 += p;
          }
        }
        var tot = p1 + p0 + p2 || 1;
        var aiProbMap = { "1": p1 / tot, "0": p0 / tot, "2": p2 / tot };

        if (ctx && ctx.isUnannouncedRisk) {
          aiProbMap["1"] = aiProbMap["1"] * 0.94 + 0.02;
          aiProbMap["0"] = aiProbMap["0"] * 0.94 + 0.025;
          aiProbMap["2"] = aiProbMap["2"] * 0.94 + 0.015;
          var s2 = aiProbMap["1"] + aiProbMap["0"] + aiProbMap["2"];
          aiProbMap["1"] /= s2; aiProbMap["0"] /= s2; aiProbMap["2"] /= s2;
        }

        var mktProbMap;
        if (mktV && mktV.length >= 3 && (mktV[0] + mktV[1] + mktV[2]) > 0) {
          var ms = mktV[0] + mktV[1] + mktV[2];
          mktProbMap = {
            "1": Math.max(0.05, mktV[0] / ms),
            "0": Math.max(0.05, mktV[1] / ms),
            "2": Math.max(0.05, mktV[2] / ms)
          };
        } else {
          var b1 = Math.pow(aiProbMap["1"], 1.18), b0 = Math.pow(aiProbMap["0"], 0.92), b2 = Math.pow(aiProbMap["2"], 1.18);
          var bs = b1 + b0 + b2;
          mktProbMap = { "1": b1 / bs, "0": b0 / bs, "2": b2 / bs };
        }

        var arr = [
          { code: "1", prob: Math.round(aiProbMap["1"] * 100) },
          { code: "0", prob: Math.round(aiProbMap["0"] * 100) },
          { code: "2", prob: Math.round(aiProbMap["2"] * 100) }
        ].sort(function(a, b) { return b.prob - a.prob; });

        var favLineupBoost = 0;
        if (ctx && ctx.isLineupAnnounced) {
          if (arr[0].code === "1") favLineupBoost = ctx.hPct - ctx.aPct;
          else if (arr[0].code === "2") favLineupBoost = ctx.aPct - ctx.hPct;
        }

        var prob1 = arr[0].prob, prob2 = arr[1].prob, prob3 = arr[2].prob;
        var diff = prob1 - prob2;
        var isUnann = !!(ctx && ctx.isUnannouncedRisk);

        var rank = "B";
        var canBeSolid = (!isUnann || (prob1 >= 65 && diff >= 35)) && (favLineupBoost >= 0);
        if (canBeSolid && prob1 >= 55 && diff >= 25) {
          rank = "S";
        } else if ((prob1 + prob2) >= 79 && diff >= 7 && !isUnann) {
          rank = "A";
        } else if ((prob1 + prob2) >= 83 && diff >= 10) {
          rank = "A";
        } else {
          rank = "B";
        }

        return {
          fNum: fNum,
          label: labelTxt || "",
          top1: arr[0].code, top2: arr[1].code, top3: arr[2].code,
          p1: prob1, p2: prob2, p3: prob3, diff: diff,
          rank: rank,
          isDay2: !!(ctx && ctx.isSecondCalendarDay),
          isLineupAnnounced: !!(ctx && ctx.isLineupAnnounced),
          isUnannouncedRisk: isUnann,
          favLineupBoost: favLineupBoost,
          aiMap: aiProbMap, mktMap: mktProbMap
        };
      }

      function calcGoalTop2(lam, ctx, isHome, teamName, fNum) {
        var effLam = lam;
        if (ctx && ctx.isLineupAnnounced) {
          var pct = isHome ? ctx.hPct : ctx.aPct;
          effLam = Math.max(0.25, Math.min(3.50, lam * (1 + (pct * 0.008))));
        }
        var ps = poissonProbs(effLam);
        var aiMap = { "0": ps[0], "1": ps[1], "2": ps[2], "3": ps[3] };
        var mktBase = { "0": 0.24, "1": 0.36, "2": 0.25, "3": 0.15 };
        var mktMap = {
          "0": aiMap["0"] * 0.65 + mktBase["0"] * 0.35,
          "1": aiMap["1"] * 0.65 + mktBase["1"] * 0.35,
          "2": aiMap["2"] * 0.65 + mktBase["2"] * 0.35,
          "3": aiMap["3"] * 0.65 + mktBase["3"] * 0.35
        };

        var arr = [
          { code: "0", prob: Math.round(ps[0] * 100) },
          { code: "1", prob: Math.round(ps[1] * 100) },
          { code: "2", prob: Math.round(ps[2] * 100) },
          { code: "3", prob: Math.round(ps[3] * 100) }
        ].sort(function(a, b) { return b.prob - a.prob; });

        var prob1 = arr[0].prob, prob2 = arr[1].prob, prob3 = arr[2].prob;
        var diff = prob1 - prob2;
        var isUnann = !!(ctx && ctx.isUnannouncedRisk);

        var rank = "B";
        if (!isUnann) {
          if (arr[0].code === "3" && prob1 >= 40 && diff >= 12) rank = "S";
          else if (prob1 >= 42 && diff >= 15) rank = "S";
          else if (prob1 >= 39 && diff >= 14) rank = "S";
        }
        if (rank !== "S") {
          if ((prob1 + prob2) >= 67) rank = "A";
          else rank = "B";
        }

        return {
          fNum: fNum,
          label: teamName || "",
          top1: arr[0].code, top2: arr[1].code, top3: arr[2].code,
          p1: prob1, p2: prob2, p3: prob3, diff: diff,
          rank: rank,
          isDay2: !!(ctx && ctx.isSecondCalendarDay),
          isLineupAnnounced: !!(ctx && ctx.isLineupAnnounced),
          isUnannouncedRisk: isUnann,
          favLineupBoost: 0,
          aiMap: aiMap, mktMap: mktMap
        };
      }

      function selectBestCoverIndices(items, count) {
        return items
          .map(function(it, idx) {
            var unannouncedBonus = it.isUnannouncedRisk ? 8 : 0;
            var sPenalty = it.rank === "S" ? -50 : 0;
            return { idx: idx, coverScore: (it.p2 * 2 - it.diff) + unannouncedBonus + sPenalty };
          })
          .sort(function(a, b) { return b.coverScore - a.coverScore; })
          .slice(0, count)
          .map(function(x) { return x.idx; });
      }

      function runMissDP(probList) {
        var dp0 = 1.0, dp1 = 0.0, dp2 = 0.0;
        for (var i = 0; i < probList.length; i++) {
          var q = Math.max(0.01, Math.min(0.99, probList[i]));
          var u = 1.0 - q;
          var next0 = dp0 * q;
          var next1 = dp1 * q + dp0 * u;
          var next2 = dp2 * q + dp1 * u;
          dp0 = next0; dp1 = next1; dp2 = next2;
        }
        return [dp0, dp1, dp2];
      }

      function evaluatePlanMetrics(items, modeOrBudget, gameType) {
        var sCount = items.filter(function(it) { return it.rank === "S"; }).length;
        var aCount = items.filter(function(it) { return it.rank === "A"; }).length;

        var isSkipRecommended = false;
        var skipReason = "";
        if (gameType === "mini_a" || gameType === "mini_b") {
          if (sCount === 0 && aCount <= 2) {
            isSkipRecommended = true;
            skipReason = "鉄板0枠のため見送り推奨（大混戦）";
          } else if (sCount === 1 && aCount === 0) {
            isSkipRecommended = true;
            skipReason = "鉄板1枠のみで残り混戦のため見送り推奨";
          }
        } else if (gameType === "goal3") {
          if (sCount <= 1 && (sCount + aCount) <= 3) {
            isSkipRecommended = true;
            skipReason = "得点鉄板枠が少なく高コストのため見送り推奨";
          }
        }

        var ticketGroups = [];
        var framePickCounts = [];

        if (modeOrBudget === "smart") {
          framePickCounts = items.map(function(it) {
            if (it.rank === "S") return 1;
            if (it.rank === "A") return 2;
            return 3;
          });

          function calcCombos(counts) {
            return counts.reduce(function(acc, c) { return acc * c; }, 1);
          }

          var maxAllowedCombos = (gameType === "toto_main") ? 16 : 12;

          while (calcCombos(framePickCounts) > maxAllowedCombos) {
            var bestBIdx = -1, minP3 = 999;
            framePickCounts.forEach(function(cnt, idx) {
              if (cnt === 3 && items[idx].p3 < minP3) { minP3 = items[idx].p3; bestBIdx = idx; }
            });
            if (bestBIdx !== -1) framePickCounts[bestBIdx] = 2;
            else break;
          }

          while (calcCombos(framePickCounts) > maxAllowedCombos) {
            var bestAIdx = -1, maxScore = -999;
            framePickCounts.forEach(function(cnt, idx) {
              var sc = items[idx].p1 * 1.5 + items[idx].diff;
              if (cnt === 2 && sc > maxScore) { maxScore = sc; bestAIdx = idx; }
            });
            if (bestAIdx !== -1) framePickCounts[bestAIdx] = 1;
            else break;
          }

          if (calcCombos(framePickCounts) === 1 && items.length >= 5) {
            var cOrder = selectBestCoverIndices(items, 1);
            if (cOrder.length > 0) framePickCounts[cOrder[0]] = 2;
          }

          var smartPicks = items.map(function(it, idx) {
            var c = framePickCounts[idx];
            if (c === 1) return [it.top1];
            if (c === 2) return [it.top1, it.top2];
            return [it.top1, it.top2, it.top3];
          });
          var smartCost = calcCombos(framePickCounts) * 100;

          var sCntNow = framePickCounts.filter(function(c) { return c === 1; }).length;
          var aCntNow = framePickCounts.filter(function(c) { return c === 2; }).length;
          var bCntNow = framePickCounts.filter(function(c) { return c === 3; }).length;

          ticketGroups.push({
            label: "強弱マルチ1枚完結（1点×" + sCntNow + " / 2点W×" + aCntNow + " / 3点×" + bCntNow + "）",
            picks: smartPicks,
            cost: smartCost
          });
        } else {
          var budget = parseInt(modeOrBudget, 10) || 500;
          var coverOrder = selectBestCoverIndices(items, items.length);
          var wCount = (budget === 500) ? 2 : ((budget === 1000 || budget === 1500) ? 3 : 4);
          var wSet = coverOrder.slice(0, wCount);
          framePickCounts = items.map(function(_, idx) { return wSet.indexOf(idx) !== -1 ? 2 : 1; });

          var mainPicks = items.map(function(it, idx) {
            return wSet.indexOf(idx) !== -1 ? [it.top1, it.top2] : [it.top1];
          });
          ticketGroups.push({
            label: "シート1：メインWマルチ",
            picks: mainPicks,
            cost: Math.pow(2, wSet.length) * 100
          });

          if (budget === 500 && coverOrder.length >= 3) {
            var m3 = coverOrder[2];
            ticketGroups.push({
              label: "シート2：押さえシングル（第" + (m3 + 1) + "枠変更）",
              picks: items.map(function(it, i) { return i === m3 ? [it.top2] : [it.top1]; }),
              cost: 100
            });
          } else if (budget === 1000 && coverOrder.length >= 5) {
            [coverOrder[3], coverOrder[4]].forEach(function(mIdx, k) {
              ticketGroups.push({
                label: "シート" + (k + 2) + "：押さえシングル（第" + (mIdx + 1) + "枠変更）",
                picks: items.map(function(it, i) { return i === mIdx ? [it.top2] : [it.top1]; }),
                cost: 100
              });
            });
          } else if (budget === 1500 && coverOrder.length >= 4) {
            var fix4 = coverOrder[3];
            var subW2 = coverOrder.slice(0, 2);
            ticketGroups.push({
              label: "シート2：サブWマルチ（第" + (fix4 + 1) + "枠固定）",
              picks: items.map(function(it, i) {
                if (i === fix4) return [it.top2];
                return subW2.indexOf(i) !== -1 ? [it.top1, it.top2] : [it.top1];
              }),
              cost: 400
            });
            for (var s = 0; s < 3; s++) {
              var bIdx = coverOrder[s];
              ticketGroups.push({
                label: "シート" + (s + 3) + "：波乱ケアシングル",
                picks: items.map(function(it, i) { return i === bIdx ? [it.top3] : [it.top1]; }),
                cost: 100
              });
            }
          } else if (budget === 2000 && coverOrder.length >= 5) {
            var fix5 = coverOrder[4];
            var subW2b = coverOrder.slice(0, 2);
            ticketGroups.push({
              label: "シート2：サブWマルチ（第" + (fix5 + 1) + "枠固定）",
              picks: items.map(function(it, i) {
                if (i === fix5) return [it.top2];
                return subW2b.indexOf(i) !== -1 ? [it.top1, it.top2] : [it.top1];
              }),
              cost: 400
            });
          }
        }

        var allTickets = [];
        ticketGroups.forEach(function(grp) {
          function expand(idx, current) {
            if (idx === grp.picks.length) {
              allTickets.push(current.slice());
              return;
            }
            var choices = grp.picks[idx];
            for (var c = 0; c < choices.length; c++) {
              current.push(choices[c]);
              expand(idx + 1, current);
              current.pop();
            }
          }
          expand(0, []);
        });

        var totalCost = allTickets.length * 100;
        var sumProb1st = 0;
        var pay1List = [];
        var weightedReturn = 0;

        allTickets.forEach(function(combo) {
          var pAi = 1.0;
          var mktProbs = [];
          for (var i = 0; i < combo.length; i++) {
            var code = combo[i];
            pAi *= Math.max(0.02, items[i].aiMap[code] || 0.12);
            mktProbs.push(Math.max(0.02, items[i].mktMap[code] || 0.12));
          }
          sumProb1st += pAi;
          var mktDp = runMissDP(mktProbs);
          var p1 = 2500;
          if (gameType === "toto_main") p1 = Math.max(500000, Math.min(100000000, 40.0 / Math.max(1e-8, mktDp[0])));
          else if (gameType === "goal3") p1 = Math.max(3000, Math.min(250000, 30.0 / Math.max(1e-6, mktDp[0])));
          else p1 = Math.max(2000, Math.min(120000, 50.0 / Math.max(1e-6, mktDp[0])));
          pay1List.push(p1);
          weightedReturn += pAi * p1;
        });

        var effQ = items.map(function(it, idx) {
          var choices = ticketGroups[0].picks[idx];
          var sumP = 0;
          choices.forEach(function(ch) { sumP += (it.aiMap[ch] || 0.15); });
          return Math.min(0.97, sumP);
        });
        var portDp = runMissDP(effQ);
        var prob2nd = portDp[1];

        pay1List.sort(function(a, b) { return a - b; });
        var minPay = pay1List[0] || 2500;
        var maxPay = pay1List[pay1List.length - 1] || 30000;

        var evRatio = Math.round(((weightedReturn + (gameType === "goal3" ? prob2nd * 2200 : 0)) / Math.max(100, totalCost)) * 100);
        var recScore = (sumProb1st * 100 * 2.2) + (sCount * 12) + (evRatio * 0.25) - (isSkipRecommended ? 80 : 0);

        return {
          cost: totalCost,
          ticketCount: allTickets.length,
          ticketGroups: ticketGroups,
          sCount: sCount,
          hitProb1stPct: sumProb1st * 100,
          hitProb2ndPct: prob2nd * 100,
          minPay: minPay,
          maxPay: maxPay,
          evRatioPct: evRatio,
          isSkipRecommended: isSkipRecommended,
          skipReason: skipReason,
          recScore: recScore
        };
      }

      /* 1枚分のマークシートHTML生成 */
      function renderSingleMarksheetTable(items, picks, isGoal3) {
        var options = isGoal3 ? ["0", "1", "2", "3"] : ["1", "0", "2"];
        var thCols = options.map(function(opt) {
          return '<th>' + (isGoal3 && opt === "3" ? "3+" : opt) + '</th>';
        }).join("");

        var rowsHtml = items.map(function(it, idx) {
          var selectedList = picks[idx] || [];
          var cnt = selectedList.length;
          var onClass = cnt === 1 ? "on-s" : (cnt === 2 ? "on-a" : "on-b");

          var cellsHtml = options.map(function(opt) {
            var isMarked = selectedList.indexOf(opt) !== -1;
            var dispTxt = (isGoal3 && opt === "3") ? "3+" : opt;
            return '<td><span class="oval' + (isMarked ? (' ' + onClass) : '') + '">' + dispTxt + '</span></td>';
          }).join("");

          return (
            '<tr>' +
              '<td class="col-frame">' + it.fNum + '</td>' +
              '<td class="col-match">' + it.label + '</td>' +
              cellsHtml +
            '</tr>'
          );
        }).join("");

        return (
          '<table class="ms-table">' +
            '<thead><tr><th>枠</th><th class="col-match">' + (isGoal3 ? 'チーム' : '対戦カード') + '</th>' + thCols + '</tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>'
        );
      }

      /* 最上部配置：公式マークシートカード（複数口ある場合は全シートを表示） */
      function buildMarksheetCardHtml(cfg, roleTag) {
        var m = cfg.metrics;
        var isGoal3 = (cfg.gameType === "goal3");

        } else if (roleTag === "best") {
          cardClass += " rec";
          statusPill = '<span class="ms-pill rec">👑 今節イチオシ（鉄板' + m.sCount + '枠）</span>';
        } else {
          statusPill = '<span class="ms-pill ok">🎯 購入候補（鉄板' + m.sCount + '枠）</span>';
        }

        /* 強弱マルチは1シート、固定予算で複数口に分かれる場合はシート1・シート2...をすべて描画 */
        var sheetsHtml = m.ticketGroups.map(function(grp, gIdx) {
          var headerHtml = m.ticketGroups.length > 1

            : '';

        }).join("");

        return (

              '</div>' +
              '<div class="ms-status-bar">' +
                statusPill +
                '<span style="color:#cbd5e1;">1等目安: <strong style="color:#fbbf24;">' + formatYen(m.minPay) + '〜</strong></span>' +
              '</div>' +

            '</div>' +

      /* 下部：細かい情報（確率・想定配当・期待値・テキスト内訳） */
      function buildDetailPlanCard(cfg) {
        var m = cfg.metrics;
        var probTxt = cfg.gameType === "goal3"
          ? '1等: <strong>' + m.hitProb1stPct.toFixed(1) + '%</strong>（2等含め <strong>' + (m.hitProb1stPct + m.hitProb2ndPct).toFixed(1) + '%</strong>）'
          : '1等: <strong>' + m.hitProb1stPct.toFixed(2) + '%</strong>（' + formatFreqText(m.hitProb1stPct) + '）';

      function judgeTicketAgainstActuals(picksArray, actualCodes, gameType) {
        var totalFrames = picksArray.length;
        var hitCount = 0, knownCount = 0;

        var tokenHtmlList = picksArray.map(function(frameChoices, idx) {
          var act = actualCodes[idx];
          var txt = frameChoices.join("/");
          if (act === null || act === undefined || act === "") {
            return '<span class="res-wait-token">' + txt + '</span>';
          }
          knownCount++;
          if (frameChoices.indexOf(String(act)) !== -1) {
            hitCount++;
            return '<span class="res-hit-token">' + txt + '</span>';
          }
          return '<span class="res-miss-token">' + txt + '</span>';
        });

        var missCount = knownCount - hitCount;
        var statusBadge = "";
        var isWin = false;

        if (knownCount < totalFrames) {
          statusBadge = '<span class="tier-badge miss">⏳ 進行中（' + hitCount + '/' + knownCount + '的中）</span>';
        } else if (gameType === "mini_a" || gameType === "mini_b") {
          if (missCount === 0) { statusBadge = '<span class="tier-badge t1">🎉 🥇 1等当選！（5/5全的中）</span>'; isWin = true; }
          else if (missCount === 1) { statusBadge = '<span class="tier-badge miss">😢 惜敗・あと1枠（4/5的中）</span>'; }
          else { statusBadge = '<span class="tier-badge miss">❌ 不的中（' + hitCount + '/5的中）</span>'; }
        } else if (gameType === "goal3") {
          if (missCount === 0) { statusBadge = '<span class="tier-badge t1">🎉 🥇 1等当選！（6/6全的中）</span>'; isWin = true; }
          else if (missCount === 1) { statusBadge = '<span class="tier-badge t2">🎉 🥈 2等当選！（5/6的中）</span>'; isWin = true; }
          else if (missCount === 2) { statusBadge = '<span class="tier-badge miss">😢 あと1枠で2等（4/6的中）</span>'; }
          else { statusBadge = '<span class="tier-badge miss">❌ 不的中（' + hitCount + '/6的中）</span>'; }
        } else {
          if (missCount === 0) { statusBadge = '<span class="tier-badge t1">🎉 🥇 1等当選！</span>'; isWin = true; }
          else if (missCount === 1) { statusBadge = '<span class="tier-badge t2">🎉 🥈 2等当選！（1枠外れ）</span>'; isWin = true; }
          else if (missCount === 2) { statusBadge = '<span class="tier-badge t3">🎉 🥉 3等当選！（2枠外れ）</span>'; isWin = true; }
          else { statusBadge = '<span class="tier-badge miss">❌ 不的中（' + hitCount + '/' + totalFrames + '的中）</span>'; }
        }

        return {
          hitCount: hitCount, knownCount: knownCount, missCount: missCount,
          totalFrames: totalFrames, lineHtml: tokenHtmlList.join(" － "),
          statusBadge: statusBadge, isWin: isWin
        };
      }

      function buildActualCodeArrays(analyzed, actuals) {
        var mainCodes = analyzed.map(function(x) {
          var a = actuals[String(x.f)];
          return a && a.res !== undefined ? String(a.res) : null;
        });
        var goal3Codes = [];
        analyzed.slice(0, 3).forEach(function(x) {
          var a = actuals[String(x.f)];
          if (a && a.hs !== undefined && a.as !== undefined) {
            goal3Codes.push(String(Math.min(3, parseInt(a.hs, 10))));
            goal3Codes.push(String(Math.min(3, parseInt(a.as, 10))));
          } else {
            goal3Codes.push(null); goal3Codes.push(null);
          }
        });
        return {
          mini_a: mainCodes.slice(0, 5),
          mini_b: mainCodes.slice(5, 10),
          goal3: goal3Codes,
          toto_main: mainCodes
        };
      }

      function registerAiPlanToMyBets(gameType, modeOrBudget) {
        if (!lastAnalyzedCache || lastAnalyzedCache.length === 0) return;
        var items = [];
        if (gameType === "goal3" && lastAnalyzedCache.length >= 3) {
          lastAnalyzedCache.slice(0, 3).forEach(function(x) { items.push(x.gH); items.push(x.gA); });
        } else if (gameType === "mini_a" && lastAnalyzedCache.length >= 5) {
          items = lastAnalyzedCache.slice(0, 5).map(function(x) { return x.c1x2; });
        } else if (gameType === "mini_b" && lastAnalyzedCache.length >= 10) {
          items = lastAnalyzedCache.slice(5, 10).map(function(x) { return x.c1x2; });
        } else if (gameType === "toto_main") {
          items = lastAnalyzedCache.map(function(x) { return x.c1x2; });
        }
        if (items.length === 0) return;

        var m = evaluatePlanMetrics(items, modeOrBudget, gameType);
        var currentBets = loadMyBets(currentRoundKey);
        var modeName = modeOrBudget === "smart" ? "AI強弱マルチ" : (modeOrBudget + "円プラン");
        m.ticketGroups.forEach(function(grp) {
          currentBets.push({
            id: "bet_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
            gameType: gameType,
            label: modeName,
            picks: grp.picks,
            cost: grp.cost
          });
        });
        saveMyBets(currentRoundKey, currentBets);
        if (currentRoundKey) renderRound(currentRoundKey);

        document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
        document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.add("hidden"); });
        var tab2Btn = document.querySelector('.tab-btn[data-tab="tab2"]');
        if (tab2Btn) tab2Btn.classList.add("active");
        document.getElementById("tab2").classList.remove("hidden");
      }

        var g3Items = [];

        var maItems = analyzed.slice(0, 5).map(function(x) { return x.c1x2; });

        var modes = ["smart", 500, 1000, 1500, 2000];
        var gameRowsCfg = [

          return (

              '<div>AI予想: [' + x.c1x2.top1 + '/' + x.c1x2.top2 + '] ｜ ' + mark + '</div>' +
            '</div>'
          );
        }).join("");

        document.getElementById("results-list").innerHTML =
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">📊 くじ種・買い方モード別の的中結果一覧</div>' +
            '<table class="tier-table">' +
              '<thead><tr><th>くじ種（確定出目）</th><th>⚡ AI強弱マルチ</th><th>500円</th><th>1,000円</th><th>1,500円</th><th>2,000円</th></tr></thead>' +
              '<tbody>' + tableRows + '</tbody>' +
            '</table>' +
          '</div>' +
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">⚽ 各試合の確定スコア＆的中一覧（全' + Object.keys(actuals).length + '試合）</div>' +
            matchScoreRows +
          '</div>';

      function renderReviewTabSection(analyzed, actuals) {
        var revEl = document.getElementById("review-list");
        if (!revEl) return;

        var sMatches = analyzed.filter(function(x) { return x.c1x2.rank === "S"; });

        analyzed.forEach(function(x) {
          var a = actuals[String(x.f)];
          if (!a || a.res === undefined) return;
          totalFin++;
          var r = String(a.res);
          if (r === x.c1x2.top1) hit1++;
          if (r === x.c1x2.top1 || r === x.c1x2.top2) hit2++;
          if (x.c1x2.rank === "S") {
            sTotal++;
            if (r === x.c1x2.top1) sHit++;
          }
        });

        var sListHtml = sMatches.length === 0
          ? '<div style="font-size:13px; color:#94a3b8;">今節は絶対基準（勝率55%以上＆差25%以上）を満たす鉄板試合がありませんでした。</div>'
          : sMatches.map(function(x) {
              var a = actuals[String(x.f)];
              var resTxt = a ? ('確定: ' + x.h + ' ' + a.hs + '-' + a.as + ' ' + x.a + ' → ' + (String(a.res) === x.c1x2.top1 ? '<strong style="color:#4ade80;">✅ 鉄板1点的中！</strong>' : '<strong style="color:#f87171;">❌ 波乱外れ</strong>')) : '結果待ち';
              return '<div class="compact-match-row"><div><strong>第' + x.f + '枠：' + x.h + ' vs ' + x.a + '</strong>（AI本命: [' + x.c1x2.top1 + '] 勝率' + x.c1x2.p1 + '%）</div><div>' + resTxt + '</div></div>';
            }).join("");

      function renderRound(roundKey) {
        if (!appData || !appData.rounds || !appData.rounds[roundKey]) return;
        currentRoundKey = roundKey;
        var rObj = appData.rounds[roundKey];
        var matches = rObj.matches || [];
        var actuals = getEffectiveActualResults(roundKey, rObj.actual_results);

        document.getElementById("round-title-badge").textContent = rObj.title || roundKey;
        document.getElementById("last-updated-text").innerHTML = "最終取得: " + (appData.last_updated || "-");

        var ctxList = analyzeMatchContextList(matches, appData.last_updated || "");

        var analyzed = matches.map(function(m, idx) {
          var hLam = parseFloat(m.h_xg || 1.3), aLam = parseFloat(m.a_xg || 1.3);
          var ctx = ctxList[idx];
          return {
            f: m.f, h: m.h, a: m.a, v: m.v || [34, 32, 34], hLam: hLam, aLam: aLam,
            ctx: ctx,
            c1x2: calc1x2DynamicDC(hLam, aLam, m.v, ctx, m.h + " vs " + m.a, m.f),
            gH: calcGoalTop2(hLam, ctx, true, m.h + "(H)", m.f + "H"),
            gA: calcGoalTop2(aLam, ctx, false, m.a + "(A)", m.f + "A")
          };
        });
        lastAnalyzedCache = analyzed;

        var configs = [];
        if (analyzed.length >= 5) {
          var maItems = analyzed.slice(0, 5).map(function(x) { return x.c1x2; });
          configs.push({
            id: "mini_a",
            shortName: "① mini toto A組（1〜5枠）",
            title: "① mini toto A組（第1〜5枠）",
            items: maItems,
            gameType: "mini_a",
            metrics: evaluatePlanMetrics(maItems, selectedMode, "mini_a")
          });
        }
        if (analyzed.length >= 10) {
          var mbItems = analyzed.slice(5, 10).map(function(x) { return x.c1x2; });
          configs.push({
            id: "mini_b",
            shortName: "② mini toto B組（6〜10枠）",
            title: "② mini toto B組（第6〜10枠）",
            items: mbItems,
            gameType: "mini_b",
            metrics: evaluatePlanMetrics(mbItems, selectedMode, "mini_b")
          });
        }
        if (analyzed.length >= 3) {
          var g3Items = [];
          analyzed.slice(0, 3).forEach(function(x) { g3Items.push(x.gH); g3Items.push(x.gA); });
          configs.push({
            id: "goal3",
            shortName: "③ toto GOAL3（1〜3試合）",
            title: "③ toto GOAL3（第1〜3枠の6チーム得点）",
            items: g3Items,
            gameType: "goal3",
            metrics: evaluatePlanMetrics(g3Items, selectedMode, "goal3")
          });
        }
        if (analyzed.length >= 10) {
          var all1x2 = analyzed.map(function(x) { return x.c1x2; });
          configs.push({
            id: "toto_main",
            shortName: "④ toto 本戦（全" + analyzed.length + "枠）",
            title: "④ toto 本戦（全" + analyzed.length + "枠・参考）",
            items: all1x2,
            gameType: "toto_main",
            metrics: evaluatePlanMetrics(all1x2, selectedMode, "toto_main")
          });
        }

        var recCandidates = configs.filter(function(c) {
          return c.gameType !== "toto_main" && !c.metrics.isSkipRecommended;
        }).sort(function(a, b) { return b.metrics.recScore - a.metrics.recScore; });
        var bestId = recCandidates.length > 0 ? recCandidates[0].id : "";

        /* 1. 最上部：全4くじ種の公式マークシート早見表 */
        document.getElementById("marksheet-summary-grid").innerHTML = configs.map(function(cfg) {
          var role = cfg.id === bestId ? "best" : "";
          return buildMarksheetCardHtml(cfg, role);
        }).join("");

        /* 2. 下部：細かい情報（確率・想定配当・期待値・テキスト買い目） */
        document.getElementById("plans-detail-list").innerHTML = configs.map(function(cfg) {
          return buildDetailPlanCard(cfg);
        }).join("");

        /* 3. 最下部：全13試合のランク・AI勝率（折りたたみ収納） */
        var compactMatchesHtml = analyzed.map(function(x) {
          var r = x.c1x2.rank;
          var rBadge = r === "S"
            ? '<span class="f-rank-tag s">🔥 S:鉄板(1点)</span>'
            : (r === "A" ? '<span class="f-rank-tag a">⚡ A:準鉄板(2点)</span>' : '<span class="f-rank-tag b">🌪️ B:混戦(3点)</span>');
          var pickDisp = r === "S" ? x.c1x2.top1 : (r === "A" ? (x.c1x2.top1 + "/" + x.c1x2.top2) : "1/0/2");
          return (
            '<div class="compact-match-row">' +
              '<div><strong>第' + x.f + '枠</strong>：' + x.h + ' vs ' + x.a + '</div>' +
              '<div style="display:flex; align-items:center; gap:8px;">' +
                rBadge +
                '<span>推奨: <strong>[' + pickDisp + ']</strong>（本命:' + x.c1x2.p1 + '% / 対抗:' + x.c1x2.p2 + '%）</span>' +
              '</div>' +
            '</div>'
          );
        }).join("");

        document.getElementById("matches-detail-area").innerHTML =
          '<details class="clean-details">' +
            '<summary>⚽ 全' + analyzed.length + '試合のS/A/Bランク＆AI勝率データを見る</summary>' +
            '<div class="details-body">' + compactMatchesHtml + '</div>' +
          '</details>';

        document.querySelectorAll(".register-plan-btn").forEach(function(rBtn) {
          rBtn.addEventListener("click", function() {
            var gType = rBtn.getAttribute("data-reg-game");
            registerAiPlanToMyBets(gType, selectedMode);
          });
        });

        try { renderResultsTabSection(analyzed, actuals); } catch (e1) { console.error(e1); }
        try { renderReviewTabSection(analyzed, actuals); } catch (e2) { console.error(e2); }
      }

      function parseUserPickInput(rawStr, expectedFrames) {
        var clean = (rawStr || "").trim().replace(/[－ー〜~\s,、]+/g, "-").replace(/^-+|-+$/g, "");
        if (!clean) return null;
        var parts = clean.indexOf("-") !== -1 ? clean.split("-") : clean.split("");
        if (parts.length !== expectedFrames) return null;

        var picks = [];
        var combos = 1;
        for (var i = 0; i < parts.length; i++) {
          var sub = parts[i].split("/").map(function(s) { return s.trim(); }).filter(function(s) { return s !== ""; });
          if (sub.length === 0) return null;
          picks.push(sub);
          combos *= sub.length;
        }
        return { picks: picks, cost: combos * 100 };
      }

      function initMyBetEvents() {
        var addBtn = document.getElementById("my-bet-add-btn");
        if (addBtn) {
          addBtn.addEventListener("click", function() {
            var gType = document.getElementById("my-bet-type").value;
            var rawPicks = document.getElementById("my-bet-picks").value;
            var memo = document.getElementById("my-bet-label").value.trim();
            var expLen = (gType === "mini_a" || gType === "mini_b") ? 5 : (gType === "goal3" ? 6 : 13);

            var parsed = parseUserPickInput(rawPicks, expLen);
            if (!parsed) {
              alert("枠数が一致しません。" + expLen + "枠分の買い目をハイフン区切り（例: 1-0-1/2-1-2）で入力してください。");
              return;
            }
            var list = loadMyBets(currentRoundKey);
            list.push({
              id: "bet_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
              gameType: gType,
              label: memo || "手動登録",
              picks: parsed.picks,
              cost: parsed.cost
            });
            saveMyBets(currentRoundKey, list);
            document.getElementById("my-bet-picks").value = "";
            document.getElementById("my-bet-label").value = "";
            if (currentRoundKey) renderRound(currentRoundKey);
          });
        }

        document.querySelectorAll(".preset-btn").forEach(function(pBtn) {
          pBtn.addEventListener("click", function() {
            var gType = pBtn.getAttribute("data-preset");
            registerAiPlanToMyBets(gType, selectedMode);
          });
        });

        var clearBtn = document.getElementById("clear-my-bets-btn");
        if (clearBtn) {
          clearBtn.addEventListener("click", function() {
            saveMyBets(currentRoundKey, []);
            if (currentRoundKey) renderRound(currentRoundKey);
          });
        }
      }

      function applyData(data) {
        appData = data;
        var sel = document.getElementById("round-select");
        sel.innerHTML = "";
        var keys = Object.keys(data.rounds || {});
        keys.forEach(function(k) {
          var opt = document.createElement("option");
          opt.value = k; opt.textContent = k;
          if (k === data.current_round) opt.selected = true;
          sel.appendChild(opt);
        });
        var activeKey = (data.current_round && data.rounds[data.current_round]) ? data.current_round : keys[0];
        if (activeKey) renderRound(activeKey);
      }

      function loadAllData() {
        if (window.__EMBEDDED_TOTO_DATA__ && window.__EMBEDDED_TOTO_DATA__.rounds) {
          applyData(window.__EMBEDDED_TOTO_DATA__);
          return;
        }
        fetch("data.json?t=" + Date.now(), { cache: "no-store" })
          .then(function(r) { return r.json(); })
          .then(function(d) { applyData(d); });
      }

      document.getElementById("round-select").addEventListener("change", function(e) {
        renderRound(e.target.value);
      });
      document.querySelectorAll(".tab-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
          document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.add("hidden"); });
          btn.classList.add("active");
          document.getElementById(btn.getAttribute("data-tab")).classList.remove("hidden");
        });
      });
      document.querySelectorAll(".budget-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".budget-btn").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          var bAttr = btn.getAttribute("data-budget");
          selectedMode = (bAttr === "smart") ? "smart" : (parseInt(bAttr, 10) || 500);
          if (currentRoundKey) renderRound(currentRoundKey);
        });
      });

      initMyBetEvents();
      initAuth();
    })();
  </script>
</body>
</html>
