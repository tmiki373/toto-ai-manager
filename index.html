<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>toto AI Manager - 全自動予想＆500円マルチ戦略</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.5;
      padding: 16px;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    /* PINロック画面 */
    #pin-overlay {
      position: fixed; inset: 0; background: #0b1120;
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .pin-box {
      background: #111827; border: 1px solid #334155; border-radius: 14px;
      padding: 28px; width: 90%; max-width: 360px; text-align: center;
    }
    .pin-box h2 { font-size: 18px; margin-bottom: 8px; color: #f8fafc; }
    .pin-box p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .pin-input {
      width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 6px;
      background: #1e293b; border: 1px solid #475569; border-radius: 8px; color: #fff; margin-bottom: 12px;
    }
    .pin-btn {
      width: 100%; padding: 12px; background: #f97316; border: none; border-radius: 8px;
      color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .pin-err { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 18px; }

    /* ヘッダー */
    .header-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 14px;
      padding: 16px 20px; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .round-badge {
      display: inline-block; background: #f97316; color: #fff; font-weight: bold;
      font-size: 13px; padding: 5px 14px; border-radius: 999px; margin-bottom: 6px;
    }
    .last-updated { font-size: 12px; color: #94a3b8; }
    .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select.round-select {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: bold;
    }
    .reload-btn {
      background: #2563eb; color: #fff; border: none; padding: 9px 16px;
      border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .reload-btn:hover { background: #1d4ed8; }

    /* タブナビゲーション */
    .tabs {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;
    }
    .tab-btn {
      background: #111827; color: #cbd5e1; border: 1px solid #1f2937;
      padding: 12px 8px; border-radius: 10px; font-size: 14px; font-weight: bold;
      cursor: pointer; text-align: center; transition: 0.15s;
    }
    .tab-btn.active { background: #f97316; color: #fff; border-color: #f97316; }

    /* 最適買い目サマリー枠 */
    .summary-box {
      background: #0f172a; border: 2px solid #10b981; border-radius: 14px;
      padding: 18px 20px; margin-bottom: 20px;
    }
    .summary-title {
      color: #4ade80; font-size: 16px; font-weight: bold; margin-bottom: 14px;
    }
    .pick-group { margin-bottom: 14px; }
    .pick-group:last-child { margin-bottom: 0; }
    .pick-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: bold; }
    .pick-values {
      background: #111827; border-left: 4px solid #f97316; border-radius: 6px;
      padding: 10px 14px; font-size: 16px; font-weight: bold; color: #fbbf24;
      letter-spacing: 1px; word-break: break-all;
    }
    .pick-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    @media (max-width: 700px) { .pick-grid-2 { grid-template-columns: 1fr; } .tabs { grid-template-columns: repeat(2, 1fr); } }

    /* セクション見出し */
    .section-heading {
      font-size: 15px; font-weight: bold; color: #f8fafc; margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }

    /* 試合カード */
    .match-card {
      background: #111827; border: 1px solid #1f2937; border-left: 4px solid #eab308;
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    }
    .match-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; flex-wrap: wrap; gap: 8px;
    }
    .match-teams { font-size: 15px; font-weight: bold; color: #f8fafc; }
    .goal3-tag {
      background: #1e293b; color: #38bdf8; border: 1px solid #0284c7;
      font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-right: 6px;
    }
    .match-rec { font-size: 14px; font-weight: bold; color: #fbbf24; }
    .match-metrics { font-size: 12px; color: #38bdf8; margin-bottom: 8px; }
    .match-analysis {
      background: #1c1917; border: 1px solid #44403c; color: #fcd34d;
      font-size: 12px; padding: 7px 10px; border-radius: 6px;
    }

    /* 500円提案プランカード */
    .plan-card {
      background: #111827; border: 1px solid #334155; border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    .plan-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; flex-wrap: wrap; gap: 8px;
    }
    .plan-title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .plan-badge {
      background: #065f46; color: #6ee7b7; font-size: 12px; font-weight: bold;
      padding: 3px 10px; border-radius: 999px;
    }
    .plan-sub { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
    .ticket-box {
      background: #1e293b; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    }
    .ticket-box:last-child { margin-bottom: 0; }
    .ticket-label { font-size: 11px; color: #fbbf24; font-weight: bold; margin-bottom: 4px; }
    .ticket-label.sub { color: #cbd5e1; }
    .ticket-line { font-size: 15px; font-weight: bold; color: #f8fafc; letter-spacing: 1px; }
    .w-pair { color: #fbbf24; background: rgba(251, 191, 36, 0.14); padding: 1px 5px; border-radius: 4px; }

    .hidden { display: none !important; }
    .empty-msg {
      background: #111827; border: 1px solid #1f2937; border-radius: 10px;
      padding: 20px; text-align: center; color: #94a3b8; font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- PINロック画面 -->
  <div id="pin-overlay" class="hidden">
    <div class="pin-box">
      <h2>toto AI Manager</h2>
      <p>アクセスPINを入力してください</p>
      <input type="password" id="pin-input" class="pin-input" maxlength="12" placeholder="••••" />
      <button id="pin-submit" class="pin-btn">ロック解除</button>
      <div id="pin-err" class="pin-err"></div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app" class="container hidden">
    <div class="header-card">
      <div>
        <div id="round-title-badge" class="round-badge">最新データ読み込み中...</div>
        <div id="last-updated-text" class="last-updated">最終取得: -</div>
      </div>
      <div class="header-controls">
        <select id="round-select" class="round-select"></select>
        <button id="reload-btn" class="reload-btn">⚡ 最新データを再読込</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab1">⚡ ①直前予想</button>
      <button class="tab-btn" data-tab="tab2">💰 ②500円提案</button>
      <button class="tab-btn" data-tab="tab3">🏁 ③結果照合</button>
      <button class="tab-btn" data-tab="tab4">📈 ④振り返り</button>
    </div>

    <!-- タブ1: 直前予想 -->
    <div id="tab1" class="tab-content">
      <div class="summary-box">
        <div class="summary-title">🏆 リアルタイム算出・最適買い目（上位2つ表示）</div>
        <div class="pick-group">
          <div id="lbl-toto-main" class="pick-label">toto 本戦（全13枠・上位2つ表示）</div>
          <div id="val-toto-main" class="pick-values">-</div>
        </div>
        <div class="pick-grid-2">
          <div class="pick-group">
            <div class="pick-label">mini toto A組（1〜5枠・上位2つ表示）</div>
            <div id="val-mini-a" class="pick-values">-</div>
          </div>
          <div class="pick-group">
            <div class="pick-label">mini toto B組（6〜10枠・上位2つ表示）</div>
            <div id="val-mini-b" class="pick-values">-</div>
          </div>
        </div>
        <div class="pick-group">
          <div class="pick-label">toto GOAL3（6枠・上位2つ表示）</div>
          <div id="val-goal3" class="pick-values">-</div>
        </div>
      </div>

      <div class="section-heading">⚡ 自動分析・試合別予測データ</div>
      <div id="matches-list"></div>
    </div>

    <!-- タブ2: 500円提案（マルチ買い＋GOAL3対応） -->
    <div id="tab2" class="tab-content hidden">
      <div class="section-heading">💰 予算500円以内・マルチ買い対応 最適購入プラン（Wマルチ400円＋シングル100円）</div>
      <div id="plans-list"></div>
    </div>

    <!-- タブ3: 結果照合 -->
    <div id="tab3" class="tab-content hidden">
      <div class="section-heading">🏁 試合結果・的中照合</div>
      <div id="results-list"></div>
    </div>

    <!-- タブ4: 振り返り -->
    <div id="tab4" class="tab-content hidden">
      <div class="section-heading">📈 今節の予測ポイント・振り返りサマリー</div>
      <div id="review-list"></div>
    </div>
  </div>

  <script>
    (function() {
      var EXPECTED_HASH = "__INJECTED_PIN_HASH__";
      var appData = null;

      // 古いローカルキャッシュの掃除
      try {
        Object.keys(localStorage).forEach(function(k) {
          if (k !== "toto_auth_ok" && k.indexOf("toto") !== -1) {
            localStorage.removeItem(k);
          }
        });
      } catch (e) {}

      function sha256Hex(str) {
        var enc = new TextEncoder().encode(str);
        return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
          return Array.from(new Uint8Array(buf)).map(function(b) {
            return b.toString(16).padStart(2, "0");
          }).join("");
        });
      }

      function unlockApp() {
        document.getElementById("pin-overlay").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        fetchData();
      }

      function initAuth() {
        if (EXPECTED_HASH === "__INJECTED_PIN_HASH__" || EXPECTED_HASH === "") {
          unlockApp();
          return;
        }
        if (localStorage.getItem("toto_auth_ok") === EXPECTED_HASH) {
          unlockApp();
          return;
        }
        document.getElementById("pin-overlay").classList.remove("hidden");
        document.getElementById("pin-submit").addEventListener("click", function() {
          var val = document.getElementById("pin-input").value || "";
          sha256Hex(val).then(function(h) {
            if (h === EXPECTED_HASH) {
              localStorage.setItem("toto_auth_ok", h);
              unlockApp();
            } else {
              document.getElementById("pin-err").textContent = "PINが正しくありません";
            }
          });
        });
      }

      function poissonProbs(lam) {
        var p0 = Math.exp(-lam);
        var p1 = lam * p0;
        var p2 = (lam * lam / 2) * p0;
        var p3 = Math.max(0.01, 1 - (p0 + p1 + p2));
        return [p0, p1, p2, p3];
      }

      function calc1x2(hLam, aLam) {
        var hp = poissonProbs(hLam);
        var ap = poissonProbs(aLam);
        var p1 = 0, p0 = 0, p2 = 0;
        for (var i = 0; i < 4; i++) {
          for (var j = 0; j < 4; j++) {
            var p = hp[i] * ap[j];
            if (i > j) p1 += p;
            else if (i === j) p0 += p;
            else p2 += p;
          }
        }
        var tot = p1 + p0 + p2 || 1;
        var arr = [
          { code: "1", prob: Math.round((p1 / tot) * 100) },
          { code: "0", prob: Math.round((p0 / tot) * 100) },
          { code: "2", prob: Math.round((p2 / tot) * 100) }
        ].sort(function(a, b) { return b.prob - a.prob; });
        return {
          top1: arr[0].code,
          top2: arr[1].code,
          p1: arr[0].prob,
          p2: arr[1].prob,
          diff: arr[0].prob - arr[1].prob,
          raw: {
            "1": Math.round((p1 / tot) * 100),
            "0": Math.round((p0 / tot) * 100),
            "2": Math.round((p2 / tot) * 100)
          }
        };
      }

      function calcGoalTop2(lam) {
        var ps = poissonProbs(lam);
        var arr = [
          { code: "0", prob: Math.round(ps[0] * 100) },
          { code: "1", prob: Math.round(ps[1] * 100) },
          { code: "2", prob: Math.round(ps[2] * 100) },
          { code: "3", prob: Math.round(ps[3] * 100) }
        ].sort(function(a, b) { return b.prob - a.prob; });
        return {
          top1: arr[0].code,
          top2: arr[1].code,
          p1: arr[0].prob,
          p2: arr[1].prob,
          diff: arr[0].prob - arr[1].prob
        };
      }

      function buildPlanCard(title, subInfo, items, wCount) {
        var sorted = items.map(function(it, idx) { return { idx: idx, diff: it.diff }; })
          .sort(function(a, b) { return a.diff - b.diff; });
        var wSet = sorted.slice(0, wCount).map(function(x) { return x.idx; });

        var multiHtml = items.map(function(it, idx) {
          if (wSet.indexOf(idx) !== -1) {
            return '<span class="w-pair">' + it.top1 + '/' + it.top2 + '</span>';
          }
          return '<span>' + it.top1 + '</span>';
        }).join(' － ');

        var singleHtml = items.map(function(it) { return it.top1; }).join(' － ');
        var multiCost = Math.pow(2, wSet.length) * 100;
        var totalCost = multiCost + 100;

        return (
          '<div class="plan-card">' +
            '<div class="plan-header">' +
              '<span class="plan-title">' + title + '</span>' +
              '<span class="plan-badge">マルチ' + multiCost + '円＋シングル100円（計' + totalCost + '円）</span>' +
            '</div>' +
            '<div class="plan-sub">' + subInfo + '</div>' +
            '<div class="ticket-box">' +
              '<div class="ticket-label">◆ メイン：Wマルチ買い（' + multiCost + '円 / 接戦' + wSet.length + '枠をダブル）</div>' +
              '<div class="ticket-line">' + multiHtml + '</div>' +
            '</div>' +
            '<div class="ticket-box">' +
              '<div class="ticket-label sub">◆ 押さえ：本命シングル買い（100円）</div>' +
              '<div class="ticket-line">' + singleHtml + '</div>' +
            '</div>' +
          '</div>'
        );
      }

      function renderRound(roundKey) {
        if (!appData || !appData.rounds || !appData.rounds[roundKey]) return;
        var rObj = appData.rounds[roundKey];
        var matches = rObj.matches || [];
        var actuals = rObj.actual_results || {};

        document.getElementById("round-title-badge").textContent = rObj.title || roundKey;
        document.getElementById("last-updated-text").textContent =
          "最終取得: " + (appData.last_updated || "-") + "（順位・天候・スタメン自動分析済）";

        var analyzed = matches.map(function(m) {
          var hLam = parseFloat(m.h_xg || 1.3);
          var aLam = parseFloat(m.a_xg || 1.3);
          var c1x2 = calc1x2(hLam, aLam);
          return {
            f: m.f,
            h: m.h,
            a: m.a,
            v: m.v || [34, 32, 34],
            hLam: hLam,
            aLam: aLam,
            analysis: m.analysis || "",
            c1x2: c1x2,
            gH: calcGoalTop2(hLam),
            gA: calcGoalTop2(aLam)
          };
        });

        // 1. ①直前予想（上位2つずつ表示）
        document.getElementById("lbl-toto-main").textContent =
          "toto 本戦（全" + analyzed.length + "枠・上位2つ表示）";
        document.getElementById("val-toto-main").textContent =
          analyzed.map(function(x) { return x.c1x2.top1 + "/" + x.c1x2.top2; }).join(" － ") || "-";

        document.getElementById("val-mini-a").textContent =
          analyzed.slice(0, 5).map(function(x) { return x.c1x2.top1 + "/" + x.c1x2.top2; }).join(" － ") || "-";

        document.getElementById("val-mini-b").textContent =
          analyzed.length >= 10
            ? analyzed.slice(5, 10).map(function(x) { return x.c1x2.top1 + "/" + x.c1x2.top2; }).join(" － ")
            : "-";

        var g3Pairs = [];
        analyzed.slice(0, 3).forEach(function(x) {
          g3Pairs.push(x.gH.top1 + "/" + x.gH.top2);
          g3Pairs.push(x.gA.top1 + "/" + x.gA.top2);
        });
        document.getElementById("val-goal3").textContent = g3Pairs.join(" － ") || "-";

        // 試合カード一覧
        var mHtml = analyzed.map(function(x) {
          var g3Tag = x.f <= 3 ? '<span class="goal3-tag">GOAL3</span>' : '';
          var vStr = x.v[0] + "% / " + x.v[1] + "% / " + x.v[2] + "%";
          var pStr = "[1]" + x.c1x2.raw["1"] + "% [0]" + x.c1x2.raw["0"] + "% [2]" + x.c1x2.raw["2"] + "%";
          return (
            '<div class="match-card">' +
              '<div class="match-top">' +
                '<div class="match-teams">第' + x.f + '枠 ' + g3Tag + '：' + x.h + ' vs ' + x.a + '</div>' +
                '<div class="match-rec">推奨：' + x.c1x2.top1 + ' / ' + x.c1x2.top2 + '</div>' +
              '</div>' +
              '<div class="match-metrics">予測λ: ' + x.hLam.toFixed(2) + ' - ' + x.aLam.toFixed(2) + ' ｜ 勝率: ' + pStr + ' ｜ 推計投票率: ' + vStr + '</div>' +
              '<div class="match-analysis">📊 ' + x.analysis + '</div>' +
            '</div>'
          );
        }).join("");
        document.getElementById("matches-list").innerHTML = mHtml || '<div class="empty-msg">試合データがありません</div>';

        // 2. ②500円提案（マルチ買い＋GOAL3対応）
        var plansHtml = "";
        if (analyzed.length >= 3) {
          var g3Items = [];
          var g3Desc = [];
          analyzed.slice(0, 3).forEach(function(x) {
            g3Items.push(x.gH);
            g3Items.push(x.gA);
            g3Desc.push("第" + x.f + "枠 " + x.h + "(λ" + x.hLam.toFixed(2) + ") vs " + x.a + "(λ" + x.aLam.toFixed(2) + ")");
          });
          plansHtml += buildPlanCard(
            "① toto GOAL3（6枠マルチ買いプラン）",
            "対象3試合の予測得点期待値：" + g3Desc.join(" ／ "),
            g3Items,
            2
          );
        }
        if (analyzed.length >= 5) {
          plansHtml += buildPlanCard(
            "② mini toto A組（1〜5枠マルチ買いプラン）",
            "1〜5枠の中で勝率差が最も小さい接戦2試合を自動でダブル（W）に設定",
            analyzed.slice(0, 5).map(function(x) { return x.c1x2; }),
            2
          );
        }
        if (analyzed.length >= 10) {
          plansHtml += buildPlanCard(
            "③ mini toto B組（6〜10枠マルチ買いプラン）",
            "6〜10枠の中で勝率差が最も小さい接戦2試合を自動でダブル（W）に設定",
            analyzed.slice(5, 10).map(function(x) { return x.c1x2; }),
            2
          );
        }
        if (analyzed.length >= 10) {
          plansHtml += buildPlanCard(
            "④ toto 本戦（全" + analyzed.length + "枠マルチ買いプラン）",
            "全試合中で最も拮抗している2試合のみをダブル（W）で押さえる高配当狙い",
            analyzed.map(function(x) { return x.c1x2; }),
            2
          );
        }
        document.getElementById("plans-list").innerHTML = plansHtml || '<div class="empty-msg">提案を生成できる試合数がありません</div>';

        // 3. ③結果照合
        var actKeys = Object.keys(actuals);
        if (actKeys.length === 0) {
          document.getElementById("results-list").innerHTML =
            '<div class="empty-msg">対象試合の終了後に結果データが自動取得され、上位2つ予想の的中照合が表示されます。</div>';
        } else {
          var hitTop1 = 0, hitTop2 = 0;
          var rRows = analyzed.map(function(x) {
            var a = actuals[String(x.f)];
            if (!a) return "";
            var ok1 = (a.res === x.c1x2.top1);
            var ok2 = (a.res === x.c1x2.top1 || a.res === x.c1x2.top2);
            if (ok1) hitTop1++;
            if (ok2) hitTop2++;
            return (
              '<div class="match-card">' +
                '<div class="match-top">' +
                  '<div class="match-teams">第' + x.f + '枠：' + x.h + ' ' + a.hs + ' - ' + a.as + ' ' + x.a + '</div>' +
                  '<div class="match-rec">結果: [' + a.res + '] ｜ 予想: ' + x.c1x2.top1 + '/' + x.c1x2.top2 + ' ' + (ok2 ? '✅的中' : '❌不的中') + '</div>' +
                '</div>' +
              '</div>'
            );
          }).join("");
          document.getElementById("results-list").innerHTML =
            '<div class="summary-box"><div class="summary-title">的中サマリー：本命的中 ' + hitTop1 + '試合 ／ 上位2つカバー的中 ' + hitTop2 + '試合</div></div>' + rRows;
        }

        // 4. ④振り返り・今節ポイント
        var closeGames = analyzed.slice().sort(function(a, b) { return a.c1x2.diff - b.c1x2.diff; }).slice(0, 3);
        var solidGames = analyzed.slice().sort(function(a, b) { return b.c1x2.diff - a.c1x2.diff; }).slice(0, 3);
        var revHtml =
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">⚠️ 波乱注意・接戦枠（マルチ買い推奨カード）</div>' +
            closeGames.map(function(g) {
              return '<div class="plan-sub">・第' + g.f + '枠 ' + g.h + ' vs ' + g.a + '（上位2択: ' + g.c1x2.top1 + '/' + g.c1x2.top2 + '、勝率差 ' + g.c1x2.diff + '%）</div>';
            }).join("") +
          '</div>' +
          '<div class="plan-card">' +
            '<div class="plan-title" style="margin-bottom:8px;">🛡️ 鉄板候補枠（シングル固定推奨カード）</div>' +
            solidGames.map(function(g) {
              return '<div class="plan-sub">・第' + g.f + '枠 ' + g.h + ' vs ' + g.a + '（本命: [' + g.c1x2.top1 + '] 勝率 ' + g.c1x2.p1 + '%）</div>';
            }).join("") +
          '</div>';
        document.getElementById("review-list").innerHTML = revHtml;
      }

      function fetchData() {
        fetch("data.json?t=" + Date.now())
          .then(function(res) { return res.json(); })
          .then(function(data) {
            appData = data;
            var sel = document.getElementById("round-select");
            sel.innerHTML = "";
            var keys = Object.keys(data.rounds || {});
            keys.forEach(function(k) {
              var opt = document.createElement("option");
              opt.value = k;
              opt.textContent = k;
              if (k === data.current_round) opt.selected = true;
              sel.appendChild(opt);
            });
            var activeKey = data.current_round || keys[0];
            if (activeKey) renderRound(activeKey);
          })
          .catch(function() {
            document.getElementById("round-title-badge").textContent = "data.json 読み込みエラー";
          });
      }

      // イベント登録
      document.getElementById("round-select").addEventListener("change", function(e) {
        renderRound(e.target.value);
      });
      document.getElementById("reload-btn").addEventListener("click", function() {
        fetchData();
      });
      document.querySelectorAll(".tab-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
          document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.add("hidden"); });
          btn.classList.add("active");
          document.getElementById(btn.getAttribute("data-tab")).classList.remove("hidden");
        });
      });

      initAuth();
    })();
  </script>
</body>
</html>
