name: Auto Update toto Predictions

on:
  push:
    branches:
      - main
    paths:
      - 'fetch_toto.py'
      - 'index.html'
      - '.github/workflows/update_toto.yml'
  workflow_dispatch:
  schedule:
    # 毎日 08:00 JST (23:00 UTC) - 翌節カード取得・前日結果の最終確定
    - cron: '0 23 * * *'
    # 土・日 10:00〜14:59 JST (01:00〜05:59 UTC) - 15分おき（昼試合スタメン〜締切直前）
    - cron: '*/15 1-5 * * 0,6'
    # 土・日 15:00〜22:59 JST (06:00〜13:59 UTC) - 30分おき（夕方・夜試合スタメン〜結果確定）
    - cron: '*/30 6-13 * * 0,6'
    # 水・金 16:00〜19:59 JST (07:00〜10:59 UTC) - 15分おき（平日ナイトゲームスタメン〜締切直前）
    - cron: '*/15 7-10 * * 3,5'
    # 水・金 20:00〜22:59 JST (11:00〜13:59 UTC) - 30分おき（試合速報〜結果確定）
    - cron: '*/30 11-13 * * 3,5'

concurrency:
  group: update-toto-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch latest toto data and embed into index.html
        env:
          APP_PIN: ${{ secrets.APP_PIN }}
        run: python fetch_toto.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto update toto data & predictions [skip ci]"
            git pull --rebase -X ours origin main || git rebase --skip
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
