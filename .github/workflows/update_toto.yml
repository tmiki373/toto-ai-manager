name: Auto Update toto Predictions

on:
  push:
    branches:
      - main
    paths:
      - 'fetch_toto.py'
      - 'index.html'
      - '.github/workflows/update_toto.yml'
  workflow_dispatch:
  schedule:
    # 毎日 08:00 JST (23:00 UTC)
    - cron: '0 23 * * *'
    # 水曜 17:15 JST (08:15 UTC)
    - cron: '15 8 * * 3'
    # 土曜・日曜 11:15 JST (02:15 UTC)
    - cron: '15 2 * * 0,6'
    # 土曜・日曜 12:15 JST (03:15 UTC)
    - cron: '15 3 * * 0,6'
    # 土曜・日曜 13:05 JST (04:05 UTC)
    - cron: '5 4 * * 0,6'
    # 土曜・日曜 14:15 JST (05:15 UTC)
    - cron: '15 5 * * 0,6'
    # 土曜・日曜 17:15 JST (08:15 UTC)
    - cron: '15 8 * * 0,6'
    # 土曜・日曜 22:30 JST (13:30 UTC)
    - cron: '30 13 * * 0,6'

concurrency:
  group: update-toto-data
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch latest toto data and embed into index.html
        env:
          APP_PIN: ${{ secrets.APP_PIN }}
        run: python fetch_toto.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto update toto data & predictions"
            git pull --rebase -X ours origin main || git rebase --skip
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
