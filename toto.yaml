name: Auto Update toto Data

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '15 3 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run fetch_toto.py
        run: python fetch_toto.py

      - name: Commit and push updated data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Dynamic update club_stats and toto rounds" && git push)